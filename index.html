<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Server Monitor Professional</title>
    <style>
        :root {
            --bg-color: #060814;
            --card-bg: #0b1120;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 24px; color: var(--primary); }
        
        /* Khu vực thống kê số dư */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .stat-title { font-size: 12px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 22px; font-weight: bold; margin-top: 5px; font-family: monospace; }
        .stat-value.total { color: var(--success); }
        .stat-value.admin { color: var(--danger); }

        .main-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h2 { font-size: 16px; color: var(--primary); margin: 0; }
        
        .btn-clear {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-clear:hover { background: var(--danger); color: #fff; }

        /* Danh sách Log AI */
        .log-list {
            max-height: 550px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .log-item {
            background: rgba(255, 255, 255, 0.02);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 4px;
        }
        .log-item.approved { border-left-color: var(--success); background: rgba(16, 185, 129, 0.03); }
        .log-item.changed { border-left-color: var(--warning); }
        
        .log-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
        .log-text { font-size: 14px; line-height: 1.5; }
        
        /* Highlight chữ */
        .hl-admin { color: #f43f5e; font-weight: bold; }
        .hl-user { color: #38bdf8; font-weight: bold; }
        .hl-money { color: #10b981; font-weight: bold; }
        .hl-info { color: #e2e8f0; font-weight: bold; }

        .empty { text-align: center; color: var(--text-sub); padding: 40px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>M.DUY AI LIVE MONITOR</h1>
            <div style="font-size: 12px; color: var(--text-sub);">Hệ thống giám sát tối cao - Lưu trữ vĩnh viễn</div>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="stat-card">
            <div class="stat-title">💰 Tổng Giao Dịch Đã Duyệt</div>
            <div id="total-approved" class="stat-value total">0đ</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">👑 Tài Khoản Admin (Loại trừ)</div>
            <div id="admin-balance" class="stat-value admin">0đ</div>
        </div>
    </div>

    <div class="main-card">
        <div class="card-header">
            <h2>🤖 BÁO CÁO PHÂN TÍCH HÀNH VI TỪ AI</h2>
            <button class="btn-clear" id="clear-btn">Xóa nhật ký</button>
        </div>
        <div id="log-list" class="log-list">
            <div class="empty">Đang đồng bộ dữ liệu hệ thống...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const logListEl = document.getElementById('log-list');
    const totalApprovedEl = document.getElementById('total-approved');
    const adminBalanceEl = document.getElementById('admin-balance');

    let oldData = null;
    let isFirstLoad = true;
    let savedLogs = JSON.parse(localStorage.getItem('duy_ai_logs')) || [];

    // Hiện lại log cũ đã lưu từ các phiên trước
    renderSavedLogs();

    // Lắng nghe biến động từ Firebase
    onValue(ref(db, '/'), (snapshot) => {
        const newData = snapshot.val();

        // 1. Tự động tính toán tổng số tiền dựa trên dữ liệu hiện tại
        calculateFinancials(newData);

        if (isFirstLoad) {
            oldData = JSON.parse(JSON.stringify(newData));
            isFirstLoad = false;
            if(savedLogs.length === 0) {
                pushAiLog('system', 'Hệ thống kết nối thành công. AI đang quét cấu trúc dữ liệu để sẵn sàng báo cáo chi tiết.');
            }
            return;
        }

        // 2. Chạy quét chuyên sâu phát hiện hành động duyệt tiền
        deepAnalyze(oldData, newData);

        // Lưu lại trạng thái cũ
        oldData = JSON.parse(JSON.stringify(newData));
    });

    // 🌟 HÀM TÍNH TỔNG TIỀN TỰ ĐỘNG
    function calculateFinancials(data) {
        if (!data) return;
        
        let totalApproved = 0;
        let adminMoney = 0;

        // Định nghĩa các từ khóa nhận diện Admin để loại trừ
        const adminKeywords = ['admin', 'mduy', 'shopmduy', 'root', 'quanly'];

        // Hàm đệ quy quét toàn bộ ngóc ngách của database để tìm tiền và trạng thái duyệt
        function scan(obj) {
            if (!obj || typeof obj !== 'object') return;

            // Nếu tìm thấy một node chứa thông tin giao dịch hoặc user
            if (obj.status === 'success' || obj.status === 'đã duyệt' || obj.status === 'approved' || obj.trangthai === 'thành công') {
                let money = obj.money || obj.sodu || obj.amount || obj.sotien || 0;
                totalApproved += Number(money);
            }

            // Quét tìm ví Admin để tách riêng
            for (let k in obj) {
                if (typeof obj[k] === 'object') {
                    // Kiểm tra xem node này có phải của admin không
                    let isAdminNode = adminKeywords.some(keyword => k.toLowerCase().includes(keyword));
                    if (isAdminNode) {
                        adminMoney += Number(obj[k].money || obj[k].sodu || obj[k].balance || 0);
                    }
                    scan(obj[k]);
                }
            }
        }

        scan(data);

        // Hiển thị lên giao diện dạng VND
        totalApprovedEl.innerText = totalApproved.toLocaleString('vi-VN') + 'đ';
        adminBalanceEl.innerText = adminMoney.toLocaleString('vi-VN') + 'đ';
    }

    // 🧠 AI PHÂN TÍCH CHI TIẾT HÀNH VI DUYỆT TIỀN
    function deepAnalyze(oldObj, newObj) {
        if (!newObj || !oldObj) return;

        // Hàm so sánh sâu giữa cũ và mới
        function compareNodes(oldNode, newNode, path = '') {
            if (typeof newNode !== 'object' || !newNode || !oldNode) return;

            // Trường hợp 1: Có một giao dịch mới hoàn toàn được thêm vào và đã duyệt sẵn
            for (let key in newNode) {
                if (!oldNode[key]) {
                    let item = newNode[key];
                    if (item && (item.status === 'success' || item.status === 'đã duyệt')) {
                        let target = item.username || item.name || item.user || 'Khách hàng';
                        let amount = item.money || item.amount || item.sotien || 0;
                        let lyDo = item.note || item.reason || 'Nạp tiền vào hệ thống';
                        
                        pushAiLog('approved', `🎉 <strong>Hành động mới:</strong> Hệ thống vừa ghi nhận một giao dịch mới thành công. Người nhận: <span class="hl-user">${target}</span>. Số tiền: <span class="hl-money">${Number(amount).toLocaleString()}đ</span>. Nội dung: <span class="hl-info">${lyDo}</span>.`);
                    }
                } else {
                    // Trường hợp 2: Giao dịch có sẵn đổi trạng thái từ "Chờ" sang "Đã duyệt"
                    let oldSub = oldNode[key];
                    let newSub = newNode[key];

                    if (typeof newSub === 'object' && oldSub) {
                        let oldStatus = oldSub.status || oldSub.trangthai;
                        let newStatus = newSub.status || newSub.trangthai;

                        if (oldStatus !== newStatus && (newStatus === 'success' || newStatus === 'đã duyệt')) {
                            let target = newSub.username || newSub.name || newSub.user || key;
                            let amount = newSub.money || newSub.amount || newSub.sotien || 0;
                            let adminName = newSub.handler || newSub.admin || 'Admin M.Duy';
                            
                            pushAiLog('approved', `✅ <strong>Lệnh duyệt tiền thành công:</strong> Người điều hành <span class="hl-admin">${adminName}</span> vừa bấm duyệt lệnh cho tài khoản <span class="hl-user">${target}</span>. Số tiền cộng vào ví là: <span class="hl-money">${Number(amount).toLocaleString()}đ</span>. Hệ thống đã lưu lại lịch sử.`);
                        }
                    }
                    
                    // Tiếp tục đào sâu xuống nếu cấu trúc lồng nhau
                    compareNodes(oldNode[key], newNode[key], path + '/' + key);
                }
            }
        }

        compareNodes(oldObj, newObj);
    }

    // Hàm tạo Log, in ra màn hình và nạp vào LocalStorage vĩnh viễn
    function pushAiLog(type, text) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString() + ' | ' + now.toLocaleDateString();
        
        const logData = { type, text, time: timeStr };
        savedLogs.unshift(logData);
        localStorage.setItem('duy_ai_logs', JSON.stringify(savedLogs));

        renderSingleLog(logData, true);
    }

    function renderSingleLog(log, isNew = false) {
        const emptyEl = document.querySelector('.empty');
        if (emptyEl) emptyEl.remove();

        const item = document.createElement('div');
        item.className = `log-item ${log.type}`;
        if (isNew) item.style.animation = "fadeIn 0.3s ease";

        item.innerHTML = `
            <div class="log-meta">
                <span>🤖 TRỢ LÝ AI BÁO CÁO DETAILED LOG</span>
                <span>${log.time}</span>
            </div>
            <div class="log-text">${log.text}</div>
        `;

        if (isNew) {
            logListEl.insertBefore(item, logListEl.firstChild);
        } else {
            logListEl.appendChild(item);
        }
    }

    function renderSavedLogs() {
        if (savedLogs.length > 0) {
            logListEl.innerHTML = '';
            savedLogs.forEach(log => renderSingleLog(log, false));
        }
    }

    // Nút xóa lịch sử
    document.getElementById('clear-btn').addEventListener('click', () => {
        if (confirm('Bạn muốn xóa sạch bộ nhớ lịch sử của AI không? (Số tiền tổng trên bảng điều khiển vẫn giữ nguyên)')) {
            localStorage.removeItem('duy_ai_logs');
            savedLogs = [];
            logListEl.innerHTML = '<div class="empty">Lịch sử trống. Đang đợi giao dịch tiếp theo...</div>';
        }
    });
</script>

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</body>
</html>
