<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.Duy AI Server Monitor</title>
    <style>
        :root {
            --bg-color: #060814;
            --card-bg: #0b1120;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 24px; color: var(--primary); letter-spacing: 0.5px; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 15px;
            border-radius: 10px;
        }
        .stat-title { font-size: 11px; color: var(--text-sub); text-transform: uppercase; }
        .stat-value { font-size: 24px; font-weight: bold; margin-top: 5px; font-family: monospace; color: var(--success); }

        .main-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h2 { font-size: 15px; color: var(--primary); margin: 0; }
        
        .btn-clear {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-clear:hover { background: var(--danger); color: #fff; }

        .log-list {
            max-height: 550px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .log-item {
            background: rgba(255, 255, 255, 0.01);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 4px;
        }
        .log-item.money-up { border-left-color: var(--success); background: rgba(16, 185, 129, 0.02); }
        .log-item.money-down { border-left-color: var(--danger); background: rgba(239, 68, 68, 0.02); }
        .log-item.key-action { border-left-color: var(--warning); background: rgba(245, 158, 11, 0.02); }
        
        .log-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
        .log-text { font-size: 14px; line-height: 1.5; }
        
        .hl-admin { color: #ff4d4d; font-weight: bold; }
        .hl-user { color: #38bdf8; font-weight: bold; }
        .hl-money { color: #10b981; font-weight: bold; }
        .hl-key { color: #a855f7; font-weight: bold; }

        .empty { text-align: center; color: var(--text-sub); padding: 40px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SHOPMDUY AI LIVE MONITOR</h1>
        <div style="font-size: 12px; color: var(--text-sub); margin-top: 4px;">Đã cấu hình bộ lọc: users | key_store | purchased_keys | system</div>
    </header>

    <div class="dashboard-grid">
        <div class="stat-card">
            <div class="stat-title">👥 Tổng thành viên hệ thống</div>
            <div id="total-users" class="stat-value" style="color: var(--primary);">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">💰 Tổng số dư tất cả tài khoản (Cộng dồn)</div>
            <div id="total-balance" class="stat-value">0đ</div>
        </div>
    </div>

    <div class="main-card">
        <div class="card-header">
            <h2>🤖 BÁO CÁO BIẾN ĐỘNG HỆ THỐNG THỜI GIAN THỰC (LƯU VĨNH VIỄN)</h2>
            <button class="btn-clear" id="clear-btn">Xóa nhật ký AI</button>
        </div>
        <div id="log-list" class="log-list">
            <div class="empty">Hệ thống AI đang đọc cấu trúc Firebase và tính toán lịch sử...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const logListEl = document.getElementById('log-list');
    const totalUsersEl = document.getElementById('total-users');
    const totalBalanceEl = document.getElementById('total-balance');

    let oldData = null;
    let isFirstLoad = true;
    let savedLogs = JSON.parse(localStorage.getItem('shopmduy_ai_logs')) || [];

    renderSavedLogs();

    // Lắng nghe biến động gốc
    onValue(ref(db, '/'), (snapshot) => {
        const newData = snapshot.val() || {};

        // 1. Thống kê số lượng User và tổng tiền từ trước đến nay trong mục "users"
        analyzeUsersData(newData.users);

        if (isFirstLoad) {
            oldData = JSON.parse(JSON.stringify(newData));
            isFirstLoad = false;
            if(savedLogs.length === 0) {
                pushAiLog('system', 'Khởi tạo thành công! AI đang quét đồng bộ 4 nhánh chính: users, key_store, purchased_keys và system.');
            }
            return;
        }

        // 2. Chạy bộ lọc đọc hành vi thời gian thực
        detectShopChanges(oldData, newData);

        oldData = JSON.parse(JSON.stringify(newData));
    });

    // 📊 QUÉT VÀ TÍNH TỔNG SỐ DƯ TOÀN BỘ TỪ TRƯỚC ĐẾN NAY (Trong mục users)
    function analyzeUsersData(usersNode) {
        if (!usersNode) return;
        let count = 0;
        let totalMoney = 0;

        for (let userId in usersNode) {
            count++;
            let u = usersNode[userId];
            // Quét các trường tiền phổ biến trong nhánh user của bạn (money, sodu, vnd, balance)
            let userMoney = u.money || u.sodu || u.vnd || u.balance || 0;
            totalMoney += Number(userMoney);
        }

        totalUsersEl.innerText = count;
        totalBalanceEl.innerText = totalMoney.toLocaleString('vi-VN') + 'đ';
    }

    // 🧠 AI PHÂN TÍCH HÀNH VI ĐỘC QUYỀN CHO SHOP M.DUY
    function detectShopChanges(oldObj, newObj) {
        // --- PHÂN TÍCH NHÁNH 1: [users] - Biến động số tiền/duyệt tiền ---
        if (newObj.users && oldObj.users) {
            for (let userId in newObj.users) {
                let oldUser = oldObj.users[userId];
                let newUser = newObj.users[userId];

                if (!oldUser) {
                    let name = newUser.username || newUser.email || newUser.name || userId;
                    pushAiLog('system', `👥 <strong>Thành viên mới:</strong> Tài khoản <span class="hl-user">${name}</span> vừa đăng ký tham gia hệ thống.`);
                    continue;
                }

                // Kiểm tra thay đổi số dư tài khoản
                let oldBal = oldUser.money || oldUser.sodu || oldUser.vnd || oldUser.balance || 0;
                let newBal = newUser.money || newUser.sodu || newUser.vnd || newUser.balance || 0;

                if (oldBal !== newBal) {
                    let name = newUser.username || newUser.name || userId;
                    let diff = newBal - oldBal;
                    
                    if (diff > 0) {
                        // Số tiền tăng -> Admin duyệt tiền hoặc nạp tiền thành công
                        pushAiLog('money-up', `✅ <strong>Duyệt tiền thành công:</strong> Admin <span class="hl-admin">M.Duy</span> vừa duyệt cộng tiền cho tài khoản <span class="hl-user">${name}</span>. Số dư tăng thêm <span class="hl-money">+${diff.toLocaleString()}đ</span> (Số dư hiện tại: ${Number(newBal).toLocaleString()}đ).`);
                    } else {
                        // Số tiền giảm -> User mua dịch vụ hoặc bị trừ tiền
                        pushAiLog('money-down', `💸 <strong>Khấu trừ tài khoản:</strong> Hệ thống đã trừ <span class="hl-admin">${Math.abs(diff).toLocaleString()}đ</span> từ tài khoản của <span class="hl-user">${name}</span> do thực hiện giao dịch mua hàng.`);
                    }
                }
            }
        }

        // --- PHÂN TÍCH NHÁNH 2: [purchased_keys] - Lịch sử mua khoá ---
        if (newObj.purchased_keys && oldObj.purchased_keys) {
            if (Object.keys(newObj.purchased_keys).length > Object.keys(oldObj.purchased_keys).length) {
                pushAiLog('key-action', `🔑 <strong>Giao dịch Key:</strong> Hệ thống vừa xuất kho một khóa bản quyền mới trong danh mục <code>purchased_keys</code> cho khách hàng.`);
            }
        }

        // --- PHÂN TÍCH NHÁNH 3: [key_store] - Kho chứa key của Admin ---
        if (newObj.key_store && oldObj.key_store) {
            let oldTotal = Object.keys(oldObj.key_store).length;
            let newTotal = Object.keys(newObj.key_store).length;
            if (newTotal > oldTotal) {
                pushAiLog('key-action', `📦 <strong>Kho hàng cập nhật:</strong> Admin vừa thêm <span class="hl-key">${newTotal - oldTotal} Key mới</span> vào kho lưu trữ <code>key_store</code>.`);
            }
        }

        // --- PHÂN TÍCH NHÁNH 4: [system] - Cấu hình hệ thống ---
        if (JSON.stringify(oldObj.system) !== JSON.stringify(newObj.system)) {
            pushAiLog('system', `⚙️ <strong>Cấu hình hệ thống:</strong> Các thông số vận hành trong thư mục <code>system</code> vừa được Admin thay đổi.`);
        }
    }

    // Xuất log ra màn hình và lưu vĩnh viễn vào bộ nhớ máy (LocalStorage)
    function pushAiLog(type, text) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString() + ' | ' + now.toLocaleDateString();
        
        const logData = { type, text, time: timeStr };
        savedLogs.unshift(logData);
        localStorage.setItem('shopmduy_ai_logs', JSON.stringify(savedLogs));

        renderSingleLog(logData, true);
    }

    function renderSingleLog(log, isNew = false) {
        const emptyEl = document.querySelector('.empty');
        if (emptyEl) emptyEl.remove();

        const item = document.createElement('div');
        item.className = `log-item ${log.type}`;
        if (isNew) item.style.animation = "fadeIn 0.2s ease";

        item.innerHTML = `
            <div class="log-meta">
                <span>🤖 TRỢ LÝ AI SHOPMDUY</span>
                <span>${log.time}</span>
            </div>
            <div class="log-text">${log.text}</div>
        `;

        if (isNew) {
            logListEl.insertBefore(item, logListEl.firstChild);
        } else {
            logListEl.appendChild(item);
        }
    }

    function renderSavedLogs() {
        if (savedLogs.length > 0) {
            logListEl.innerHTML = '';
            savedLogs.forEach(log => renderSingleLog(log, false));
        }
    }

    document.getElementById('clear-btn').addEventListener('click', () => {
        if (confirm('Xóa sạch nhật ký hiển thị của AI? (Số liệu tổng bên trên không bị ảnh hưởng)')) {
            localStorage.removeItem('shopmduy_ai_logs');
            savedLogs = [];
            logListEl.innerHTML = '<div class="empty">Nhật ký trống. Đang đợi biến động thực tế...</div>';
        }
    });
</script>

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</body>
</html>
