<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FF Web - Cơ chế Vút Tâm (Drag Headshot)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* Tâm ngắm */
        #crosshair {
            position: fixed; top: 50%; left: 50%; width: 24px; height: 24px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
            transition: transform 0.05s;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 3px black;
        }
        #crosshair::before { top: 11px; left: 0; width: 24px; height: 2px; }
        #crosshair::after { top: 0; left: 11px; width: 2px; height: 24px; }
        
        /* Đổi màu tâm khi khóa mục tiêu */
        #crosshair.locked::before, #crosshair.locked::after {
            background: #00ff00; box-shadow: 0 0 8px #00ff00;
        }

        /* UI */
        #ui {
            position: fixed; top: 20px; left: 20px; color: white; font-weight: bold;
            text-shadow: 2px 2px 0 #000; z-index: 10; font-size: 20px;
        }
        #ammo {
            position: fixed; bottom: 20px; right: 20px; color: white; font-weight: bold;
            text-shadow: 2px 2px 0 #000; z-index: 10; font-size: 30px;
        }
        
        /* Hiệu ứng chữ khi bắn trúng */
        #hitmarker {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
            color: red; font-size: 30px; font-weight: bold; opacity: 0; 
            pointer-events: none; z-index: 20; transition: opacity 0.2s;
            text-shadow: 0 0 10px black; text-align: center;
        }

        /* Hướng dẫn */
        #hint {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            color: white; font-size: 14px; text-shadow: 1px 1px 0 #000;
            z-index: 10; text-align: center; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">Kills: <span id="kills">0</span></div>
    <div id="ammo">🔫 <span id="ammo-count">30</span> / 30</div>
    <div id="hitmarker">💥 HEADSHOT!</div>
    <div id="hint">Vuốt lên khi bắn để vút tâm lên đầu!</div>

<script>
    // ==========================================
    // 1. KHỞI TẠO 3D
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.y = 1.6;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Ánh sáng
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // Mặt đất
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x3a7d44 }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Vật cản
    for (let i = 0; i < 10; i++) {
        const box = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshLambertMaterial({ color: 0x8B4513 }));
        box.position.set((Math.random() - 0.5) * 40, 1, (Math.random() - 0.5) * 40);
        scene.add(box);
    }

    // Súng
    const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.6), new THREE.MeshLambertMaterial({ color: 0x333333 }));
    gun.position.set(0.3, -0.3, -0.5);
    camera.add(gun);
    scene.add(camera);

    // ==========================================
    // 2. TẠO BOT (Có đủ Bụng, Ngực, Cổ, Đầu)
    // ==========================================
    let enemies = [];
    let kills = 0;
    const crosshairEl = document.getElementById('crosshair');

    function createEnemy() {
        const enemyGroup = new THREE.Group();

        // Chân
        const legs = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.25), new THREE.MeshLambertMaterial({ color: 0x1a1a2e }));
        legs.position.y = 0.35;
        legs.userData = { part: 'legs', hp: 100, damage: 15 };
        enemyGroup.add(legs);

        // Bụng (Aim Assist hút vào đây)
        const stomach = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.35, 0.28), new THREE.MeshLambertMaterial({ color: 0x0000ff }));
        stomach.position.y = 0.87;
        stomach.userData = { part: 'stomach', hp: 100, damage: 25 };
        enemyGroup.add(stomach);

        // Ngực
        const chest = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.35, 0.3), new THREE.MeshLambertMaterial({ color: 0x0000cc }));
        chest.position.y = 1.22;
        chest.userData = { part: 'chest', hp: 100, damage: 30 };
        enemyGroup.add(chest);

        // Cổ
        const neck = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.12, 0.15), new THREE.MeshLambertMaterial({ color: 0xffccaa }));
        neck.position.y = 1.45;
        neck.userData = { part: 'neck', hp: 100, damage: 50 };
        enemyGroup.add(neck);

        // Đầu
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshLambertMaterial({ color: 0xffccaa }));
        head.position.y = 1.66;
        head.userData = { part: 'head', hp: 100, damage: 100 };
        enemyGroup.add(head);

        enemyGroup.position.set((Math.random() - 0.5) * 30, 0, (Math.random() - 0.5) * 30 - 10);
        enemyGroup.speed = 0.01 + Math.random() * 0.02;
        enemyGroup.direction = Math.random() * Math.PI * 2;
        
        scene.add(enemyGroup);
        enemies.push(enemyGroup);
    }

    for (let i = 0; i < 10; i++) createEnemy();

    // ==========================================
    // 3. CƠ CHẾ VÚT TÂM (DRAG HEADSHOT)
    // ==========================================
    let shootCooldown = false;
    let ammo = 30;
    const maxAmmo = 30;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(0, 0);

    let aimOffsetY = 0; // Độ lệch tâm (Kéo lên)
    let targetEnemy = null;
    let lastTouchY = 0;

    // Hàm lấy điểm hút (Bụng của địch)
    function getStomachPoint(enemy) {
        const stomach = enemy.children.find(c => c.userData.part === 'stomach');
        if (!stomach) return null;
        const pos = new THREE.Vector3();
        stomach.getWorldPosition(pos);
        return pos;
    }

    // Cập nhật Aim Assist (Tự hút vào bụng)
    function updateAimAssist() {
        if (enemies.length === 0) { targetEnemy = null; crosshairEl.classList.remove('locked'); return; }

        const center = new THREE.Vector2(0, 0);
        let closestEnemy = null;
        let minDist = 0.3; // Bán kính hút

        enemies.forEach(enemy => {
            const aimPoint = getStomachPoint(enemy);
            if (!aimPoint) return;

            const screenPos = aimPoint.clone().project(camera);
            const dist = center.distanceTo(new THREE.Vector2(screenPos.x, screenPos.y));

            if (dist < minDist) {
                minDist = dist;
                closestEnemy = enemy;
            }
        });

        if (closestEnemy) {
            targetEnemy = closestEnemy;
            const stomachPoint = getStomachPoint(closestEnemy);
            const head = closestEnemy.children.find(c => c.userData.part === 'head');
            const headPos = new THREE.Vector3();
            head.getWorldPosition(headPos);
            
            // Tính hướng từ bụng lên đầu
            const basePoint = stomachPoint.clone();
            const headDir = headPos.clone().sub(basePoint).normalize();
            
            // Áp dụng độ kéo của người chơi (aimOffsetY)
            // Kéo càng mạnh, tâm càng lên cao
            const finalPoint = basePoint.clone().add(headDir.multiplyScalar(aimOffsetY * 0.8));
            
            camera.lookAt(finalPoint);
            crosshairEl.classList.add('locked');
        } else {
            targetEnemy = null;
            crosshairEl.classList.remove('locked');
            // Từ từ reset tâm về giữa
            aimOffsetY *= 0.9; 
        }
    }

    // ==========================================
    // 4. ĐIỀU KHIỂN VUỐT (MOBILE & PC)
    // ==========================================
    // Chuột (PC)
    let isDragging = false;
    let prevMouseY = 0;

    document.addEventListener('mousedown', (e) => {
        if (e.button === 0) { isDragging = true; prevMouseY = e.clientY; }
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaY = prevMouseY - e.clientY;
        prevMouseY = e.clientY;
        
        if (targetEnemy) {
            // Có địch -> Kéo tâm lên đầu
            aimOffsetY += deltaY * 0.02;
            aimOffsetY = Math.max(0, Math.min(1.5, aimOffsetY));
        } else {
            // Không có địch -> Xoay camera bình thường
            camera.rotation.x += deltaY * 0.003;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        }
    });

    document.addEventListener('mouseup', (e) => {
        if (e.button === 0) {
            if (Math.abs(aimOffsetY) < 0.1) shoot(); // Click nhẹ = bắn
            isDragging = false;
        }
    });

    // Cảm ứng (Mobile)
    document.addEventListener('touchstart', (e) => {
        lastTouchY = e.touches[0].clientY;
        isDragging = true;
    });

    document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touchY = e.touches[0].clientY;
        const deltaY = lastTouchY - touchY;
        lastTouchY = touchY;

        if (targetEnemy) {
            aimOffsetY += deltaY * 0.03; // Mobile nhạy hơn chút
            aimOffsetY = Math.max(0, Math.min(1.5, aimOffsetY));
        } else {
            camera.rotation.x += deltaY * 0.005;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        }
    });

    document.addEventListener('touchend', (e) => {
        if (e.changedTouches.length > 0) {
            const touch = e.changedTouches[0];
            const dist = Math.hypot(touch.clientX - touch.clientX, touch.clientY - lastTouchY);
            if (dist < 10) shoot(); // Chạm nhẹ = bắn
        }
        isDragging = false;
    });

    // ==========================================
    // 5. HÀM BẮN VÀ TÍNH SÁT THƯƠNG
    // ==========================================
    function shoot() {
        if (shootCooldown || ammo <= 0) return;
        
        gun.position.z = -0.4;
        setTimeout(() => gun.position.z = -0.5, 50);

        ammo--;
        document.getElementById('ammo-count').innerText = ammo;
        shootCooldown = true;
        setTimeout(() => shootCooldown = false, 150);

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);

        for (let i = 0; i < intersects.length; i++) {
            const hit = intersects[i];
            const partData = hit.object.userData;

            if (partData.part) {
                // Nổ máu
                createBloodParticle(hit.point, partData.part === 'head' ? 0xff0000 : 0xaa0000);
                
                if (partData.part === 'head') {
                    // HEADSHOT: 100 Dame (Chết ngay)
                    kills++;
                    document.getElementById('kills').innerText = kills;
                    showHitmarker("💥 HEADSHOT! (-100)");
                    removeEnemy(hit.object.parent);
                } else {
                    // BODY: Dame nhỏ
                    showHitmarker(`🎯 ${partData.part.toUpperCase()} (-${partData.damage})`);
                    partData.hp -= partData.damage;
                    if (partData.hp <= 0) {
                        kills++;
                        document.getElementById('kills').innerText = kills;
                        removeEnemy(hit.object.parent);
                    }
                }
                break; 
            }
        }
    }

    function showHitmarker(text) {
        const hm = document.getElementById('hitmarker');
        hm.innerText = text;
        hm.style.opacity = 1;
        setTimeout(() => hm.style.opacity = 0, 300);
    }

    function removeEnemy(enemyGroup) {
        scene.remove(enemyGroup);
        enemies = enemies.filter(e => e !== enemyGroup);
        if (targetEnemy === enemyGroup) targetEnemy = null;
        setTimeout(createEnemy, 2000);
    }

    function createBloodParticle(pos, color) {
        const particle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: color }));
        particle.position.copy(pos);
        const velocity = new THREE.Vector3((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5);
        scene.add(particle);
        let life = 1.0;
        function animateParticle() {
            if (life <= 0) { scene.remove(particle); return; }
            life -= 0.05;
            particle.position.add(velocity);
            particle.scale.set(life, life, life);
            requestAnimationFrame(animateParticle);
        }
        animateParticle();
    }

    // ==========================================
    // 6. GAME LOOP
    // ==========================================
    function animate() {
        requestAnimationFrame(animate);

        enemies.forEach(enemy => {
            enemy.position.x += Math.cos(enemy.direction) * enemy.speed;
            enemy.position.z += Math.sin(enemy.direction) * enemy.speed;
            if (Math.abs(enemy.position.x) > 30 || Math.abs(enemy.position.z) > 30) {
                enemy.direction += Math.PI / 2;
            }
            enemy.rotation.y = -enemy.direction;
        });

        updateAimAssist();

        if (ammo === 0) {
            setTimeout(() => { ammo = maxAmmo; document.getElementById('ammo-count').innerText = ammo; }, 1500);
            ammo = -1;
        }

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
