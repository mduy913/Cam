<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FF Web Clone - Fixed Controls</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; }
        
        #crosshair {
            position: fixed; top: 50%; left: 50%; width: 24px; height: 24px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 3px black;
        }
        #crosshair::before { top: 11px; left: 0; width: 24px; height: 2px; }
        #crosshair::after { top: 0; left: 11px; width: 2px; height: 24px; }
        #crosshair.locked::before, #crosshair.locked::after { background: #00ff00; box-shadow: 0 0 8px #00ff00; }

        #ui { position: fixed; top: 20px; left: 20px; color: white; font-weight: bold; text-shadow: 2px 2px 0 #000; z-index: 10; font-size: 20px; }
        #hitmarker {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
            color: red; font-size: 30px; font-weight: bold; opacity: 0; 
            pointer-events: none; z-index: 20; transition: opacity 0.2s;
            text-shadow: 0 0 10px black; text-align: center;
        }

        /* Joystick */
        #joystick-zone {
            position: fixed; bottom: 20px; left: 20px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2); border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5); z-index: 100;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.8); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
            transition: transform 0.05s;
        }
        
        /* Buttons */
        #btn-jump {
            position: fixed; bottom: 30px; right: 140px; width: 60px; height: 60px;
            background: rgba(0, 150, 255, 0.7); border: 2px solid white;
            border-radius: 50%; color: white; font-weight: bold; font-size: 18px;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; cursor: pointer;
        }
        #btn-fire {
            position: fixed; bottom: 30px; right: 30px; width: 90px; height: 90px;
            background: rgba(255, 0, 0, 0.7); border: 2px solid white;
            border-radius: 50%; color: white; font-weight: bold; font-size: 24px;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">Kills: <span id="kills">0</span></div>
    <div id="hitmarker">💥 HEADSHOT!</div>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="btn-jump">NHẢY</div>
    <div id="btn-fire">BẮN</div>

<script>
    // ==========================================
    // 1. KHỞI TẠO 3D
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.y = 1.6;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x3a7d44 }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    for (let i = 0; i < 15; i++) {
        const box = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshLambertMaterial({ color: 0x8B4513 }));
        box.position.set((Math.random() - 0.5) * 50, 1, (Math.random() - 0.5) * 50);
        scene.add(box);
    }

    const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.6), new THREE.MeshLambertMaterial({ color: 0x333333 }));
    gun.position.set(0.3, -0.3, -0.5);
    camera.add(gun);
    scene.add(camera);

    // ==========================================
    // 2. TẠO BOT
    // ==========================================
    let enemies = [];
    let kills = 0;
    const crosshairEl = document.getElementById('crosshair');

    function createEnemy() {
        const enemyGroup = new THREE.Group();

        const legs = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.25), new THREE.MeshLambertMaterial({ color: 0x1a1a2e }));
        legs.position.y = 0.35; legs.userData = { part: 'legs', hp: 100, damage: 15 }; enemyGroup.add(legs);

        const stomach = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.35, 0.28), new THREE.MeshLambertMaterial({ color: 0x0000ff }));
        stomach.position.y = 0.87; stomach.userData = { part: 'stomach', hp: 100, damage: 25 }; enemyGroup.add(stomach);

        const chest = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.35, 0.3), new THREE.MeshLambertMaterial({ color: 0x0000cc }));
        chest.position.y = 1.22; chest.userData = { part: 'chest', hp: 100, damage: 30 }; enemyGroup.add(chest);

        const neck = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.12, 0.15), new THREE.MeshLambertMaterial({ color: 0xffccaa }));
        neck.position.y = 1.45; neck.userData = { part: 'neck', hp: 100, damage: 50 }; enemyGroup.add(neck);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshLambertMaterial({ color: 0xffccaa }));
        head.position.y = 1.66; head.userData = { part: 'head', hp: 100, damage: 100 }; enemyGroup.add(head);

        enemyGroup.position.set((Math.random() - 0.5) * 40, 0, (Math.random() - 0.5) * 40 - 10);
        enemyGroup.speed = 0.02 + Math.random() * 0.03;
        enemyGroup.direction = Math.random() * Math.PI * 2;
        
        scene.add(enemyGroup);
        enemies.push(enemyGroup);
    }

    for (let i = 0; i < 10; i++) createEnemy();

    // ==========================================
    // 3. CƠ CHẾ VÚT TÂM & BẮN
    // ==========================================
    let isFiring = false;
    let shootCooldown = false;
    let aimOffsetY = 0; 
    let targetEnemy = null;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(0, 0);

    function getStomachPoint(enemy) {
        const stomach = enemy.children.find(c => c.userData.part === 'stomach');
        if (!stomach) return null;
        const pos = new THREE.Vector3();
        stomach.getWorldPosition(pos);
        return pos;
    }

    function updateAimAssist() {
        if (enemies.length === 0) { targetEnemy = null; crosshairEl.classList.remove('locked'); return; }

        const center = new THREE.Vector2(0, 0);
        let closestEnemy = null;
        let minDist = 0.3; 

        enemies.forEach(enemy => {
            const aimPoint = getStomachPoint(enemy);
            if (!aimPoint) return;
            const screenPos = aimPoint.clone().project(camera);
            const dist = center.distanceTo(new THREE.Vector2(screenPos.x, screenPos.y));
            if (dist < minDist) {
                minDist = dist;
                closestEnemy = enemy;
            }
        });

        if (closestEnemy) {
            targetEnemy = closestEnemy;
            const stomachPoint = getStomachPoint(closestEnemy);
            const head = closestEnemy.children.find(c => c.userData.part === 'head');
            const headPos = new THREE.Vector3();
            head.getWorldPosition(headPos);
            
            const basePoint = stomachPoint.clone();
            const headDir = headPos.clone().sub(basePoint).normalize();
            const finalPoint = basePoint.clone().add(headDir.multiplyScalar(aimOffsetY * 0.8));
            
            camera.lookAt(finalPoint);
            crosshairEl.classList.add('locked');
        } else {
            targetEnemy = null;
            crosshairEl.classList.remove('locked');
            aimOffsetY *= 0.9; 
        }
    }

    function shoot() {
        if (shootCooldown) return;
        gun.position.z = -0.4;
        setTimeout(() => gun.position.z = -0.5, 50);
        shootCooldown = true;
        setTimeout(() => shootCooldown = false, 150);

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);

        for (let i = 0; i < intersects.length; i++) {
            const hit = intersects[i];
            const partData = hit.object.userData;

            if (partData.part) {
                createBloodParticle(hit.point, partData.part === 'head' ? 0xff0000 : 0xaa0000);
                if (partData.part === 'head') {
                    kills++; document.getElementById('kills').innerText = kills;
                    showHitmarker("💥 HEADSHOT! (-100)"); removeEnemy(hit.object.parent);
                } else {
                    showHitmarker(`🎯 ${partData.part.toUpperCase()} (-${partData.damage})`);
                    partData.hp -= partData.damage;
                    if (partData.hp <= 0) {
                        kills++; document.getElementById('kills').innerText = kills; removeEnemy(hit.object.parent);
                    }
                }
                break; 
            }
        }
    }

    function showHitmarker(text) {
        const hm = document.getElementById('hitmarker');
        hm.innerText = text; hm.style.opacity = 1;
        setTimeout(() => hm.style.opacity = 0, 300);
    }

    function removeEnemy(enemyGroup) {
        scene.remove(enemyGroup);
        enemies = enemies.filter(e => e !== enemyGroup);
        if (targetEnemy === enemyGroup) targetEnemy = null;
        setTimeout(createEnemy, 2000);
    }

    function createBloodParticle(pos, color) {
        const particle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: color }));
        particle.position.copy(pos);
        const velocity = new THREE.Vector3((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5);
        scene.add(particle);
        let life = 1.0;
        function animateParticle() {
            if (life <= 0) { scene.remove(particle); return; }
            life -= 0.05; particle.position.add(velocity); particle.scale.set(life, life, life);
            requestAnimationFrame(animateParticle);
        }
        animateParticle();
    }

    // ==========================================
    // 4. ĐIỀU KHIỂN (ĐÃ SỬA LỖI NGƯỢC CHIỀU)
    // ==========================================
    let moveX = 0; let moveZ = 0;
    let isJumping = false; let velocityY = 0;
    let isDraggingCamera = false;
    let lastTouchX = 0, lastTouchY = 0;

    // --- Joystick (Đã tối ưu để không bị trượt) ---
    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');
    let joyActive = false, joyCenter = { x: 0, y: 0 };

    joyZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        joyActive = true;
        const rect = joyZone.getBoundingClientRect();
        joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
    });

    document.addEventListener('touchmove', (e) => {
        if (joyActive) {
            const touch = Array.from(e.touches).find(t => {
                // Chỉ xử lý nếu chạm vào vùng joystick
                const rect = joyZone.getBoundingClientRect();
                return t.clientX >= rect.left - 20 && t.clientX <= rect.right + 20 && t.clientY >= rect.top - 20 && t.clientY <= rect.bottom + 20;
            });
            if (!touch) return;

            let dx = touch.clientX - joyCenter.x;
            let dy = touch.clientY - joyCenter.y;
            const maxDist = 40;
            const dist = Math.hypot(dx, dy);
            
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            
            moveX = dx / maxDist;
            moveZ = dy / maxDist;
        }
    }, { passive: false });

    joyZone.addEventListener('touchend', () => {
        joyActive = false;
        joyKnob.style.transform = `translate(-50%, -50%)`;
        moveX = 0; moveZ = 0;
    });

    // --- Nút Nhảy ---
    document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!isJumping) { isJumping = true; velocityY = 0.15; }
    });

    // --- Nút Bắn ---
    const fireBtn = document.getElementById('btn-fire');
    fireBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        isFiring = true; shoot();
        setInterval(() => { if (isFiring) shoot(); }, 150);
    });
    fireBtn.addEventListener('touchend', (e) => { e.preventDefault(); isFiring = false; });

    // --- Vuốt Camera (Đã sửa lỗi ngược chiều) ---
    document.addEventListener('touchstart', (e) => {
        // Chỉ kéo cam nếu chạm vào vùng trống (không chạm nút)
        if (e.target === renderer.domElement) {
            isDraggingCamera = true;
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
        }
    });

    document.addEventListener('touchmove', (e) => {
        if (isDraggingCamera && e.target === renderer.domElement) {
            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            
            // SỬA LỖI NGƯỢC CHIỀU: Lấy toạ độ mới trừ toạ độ cũ
            const deltaX = touchX - lastTouchX;
            const deltaY = touchY - lastTouchY;
            
            if (targetEnemy) {
                // Nếu có địch, kéo lên (deltaY âm) -> tâm bay lên đầu
                aimOffsetY -= deltaY * 0.03;
                aimOffsetY = Math.max(0, Math.min(1.5, aimOffsetY));
            } else {
                // Xoay camera (kéo phải thì quay phải, kéo lên thì ngẩng lên)
                camera.rotation.y -= deltaX * 0.005;
                camera.rotation.x -= deltaY * 0.005;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            }
            
            lastTouchX = touchX;
            lastTouchY = touchY;
        }
    });

    document.addEventListener('touchend', () => { isDraggingCamera = false; });

    // ==========================================
    // 5. GAME LOOP
    // ==========================================
    function animate() {
        requestAnimationFrame(animate);

        const moveSpeed = 0.1;
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        
        // Joystick đẩy lên (moveZ âm) -> Tiến tới
        camera.position.add(forward.multiplyScalar(-moveZ * moveSpeed));
        camera.position.add(right.multiplyScalar(moveX * moveSpeed));
        camera.position.y = Math.max(1.6, camera.position.y); 

        if (isJumping) {
            camera.position.y += velocityY;
            velocityY -= 0.01;
            if (camera.position.y <= 1.6) { camera.position.y = 1.6; isJumping = false; }
        }

        enemies.forEach(enemy => {
            enemy.position.x += Math.cos(enemy.direction) * enemy.speed;
            enemy.position.z += Math.sin(enemy.direction) * enemy.speed;
            if (Math.abs(enemy.position.x) > 40 || Math.abs(enemy.position.z) > 40) enemy.direction += Math.PI / 2;
            enemy.rotation.y = -enemy.direction;
        });

        updateAimAssist();
        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
