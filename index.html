<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOPMDUY AI MONITOR - ULTRA SPEED</title>
    <style>
        :root {
            --bg-color: #060814;
            --card-bg: #0b1120;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 24px; color: var(--primary); letter-spacing: 0.5px; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .stat-title { font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 28px; font-weight: bold; margin-top: 5px; font-family: monospace; }
        .stat-value.total { color: var(--success); }
        .stat-value.users { color: var(--primary); }

        .main-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h2 { font-size: 15px; color: var(--primary); margin: 0; }
        
        .btn-clear {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-clear:hover { background: var(--danger); color: #fff; }

        .log-list {
            max-height: 550px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .log-item {
            background: rgba(255, 255, 255, 0.01);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 4px;
        }
        .log-item.money-up { border-left-color: var(--success); background: rgba(16, 185, 129, 0.02); }
        .log-item.money-down { border-left-color: var(--danger); background: rgba(239, 68, 68, 0.02); }
        .log-item.key-action { border-left-color: var(--warning); background: rgba(245, 158, 11, 0.02); }
        
        .log-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
        .log-text { font-size: 14px; line-height: 1.5; }
        
        .hl-admin { color: #ff4d4d; font-weight: bold; }
        .hl-user { color: #38bdf8; font-weight: bold; }
        .hl-money { color: #10b981; font-weight: bold; }
        .hl-key { color: #a855f7; font-weight: bold; }

        .empty { text-align: center; color: var(--text-sub); padding: 40px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SHOPMDUY AI CONTROL PANEL</h1>
        <div style="font-size: 12px; color: var(--text-sub); margin-top: 4px;">Công nghệ Multi-Stream: Độc lập nhánh `users` & `purchased_keys`</div>
    </header>

    <div class="dashboard-grid">
        <div class="stat-card">
            <div class="stat-title">👥 Tổng thành viên thường (Bỏ Admin)</div>
            <div id="total-users" class="stat-value users">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">📊 Tổng số dư tích lũy hiện tại (Trừ Admin)</div>
            <div id="total-revenue" class="stat-value total">0đ</div>
        </div>
    </div>

    <div class="main-card">
        <div class="card-header">
            <h2>🤖 NHẬT KÝ ĐỌC HÀNH VI TỐC ĐỘ CAO (LƯU TRỮ VĨNH VIỄN)</h2>
            <button class="btn-clear" id="clear-btn">Xóa nhật ký AI</button>
        </div>
        <div id="log-list" class="log-list">
            <div class="empty">Hệ thống AI đang kết nối trực tiếp vào luồng dữ liệu...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const logListEl = document.getElementById('log-list');
    const totalUsersEl = document.getElementById('total-users');
    const totalRevenueEl = document.getElementById('total-revenue');

    let savedLogs = JSON.parse(localStorage.getItem('shopmduy_ai_v4_logs')) || [];
    const adminKeywords = ['admin', 'mduy', 'shopmduy', 'root', 'quanly'];

    let oldUsersData = null;
    let isFirstLoadUsers = true;

    let oldKeysData = null;
    let isFirstLoadKeys = true;

    renderSavedLogs();

    // 🔴 LUỒNG TRUYỀN 1: Cắm thẳng vào nhánh 'users' (Duyệt tiền, đổi số dư)
    onValue(ref(db, 'users'), (snapshot) => {
        const usersData = snapshot.val() || {};

        // 1. Tính toán số tiền tổng và số lượng user ngay khi có thay đổi
        controlFinancials(usersData);

        // Lần đầu tải trang, chỉ ghi nhận mốc dữ liệu cũ
        if (isFirstLoadUsers) {
            oldUsersData = JSON.parse(JSON.stringify(usersData));
            isFirstLoadUsers = false;
            checkInitialSystem();
            return;
        }

        // Kiểm tra biến động tiền tệ
        detectUserChanges(oldUsersData, usersData);

        // Cập nhật lại mốc so sánh
        oldUsersData = JSON.parse(JSON.stringify(usersData));
    });


    // 🟣 LUỒNG TRUYỀN 2: Cắm thẳng vào nhánh 'purchased_keys' (Khách mua key)
    onValue(ref(db, 'purchased_keys'), (snapshot) => {
        const keysData = snapshot.val() || {};

        if (isFirstLoadKeys) {
            oldKeysData = JSON.parse(JSON.stringify(keysData));
            isFirstLoadKeys = false;
            checkInitialSystem();
            return;
        }

        // Kiểm tra xem số lượng key có tăng lên không (Có người mua key mới)
        const oldLength = oldKeysData ? Object.keys(oldKeysData).length : 0;
        const newLength = keysData ? Object.keys(keysData).length : 0;

        if (newLength > oldLength) {
            // Lấy ra phần tử cuối cùng vừa được thêm vào
            const keysArray = Object.keys(keysData);
            const newestKeyId = keysArray[keysArray.length - 1];
            const newestKeyInfo = keysData[newestKeyId];

            let buyer = newestKeyInfo.username || newestKeyInfo.user || newestKeyInfo.name || "Ẩn danh";
            let keyName = newestKeyInfo.key_name || newestKeyInfo.product || newestKeyId;

            pushAiLog('key-action', `🔑 <strong>Giao dịch Key thành công:</strong> Khách hàng <span class="hl-user">${buyer}</span> vừa thực hiện mua thành công mã key <span class="hl-key">${keyName}</span>. Hệ thống đã xuất kho dịch vụ.`);
        }

        oldKeysData = JSON.parse(JSON.stringify(keysData));
    });


    // --- HÀM TÍNH TOÁN VÀ SÀNG LỌC TIỀN TỪ NHÁNH USERS ---
    function controlFinancials(usersNode) {
        let userCount = 0;
        let totalMoney = 0;

        for (let userId in usersNode) {
            let u = usersNode[userId];
            let name = (u.username || u.name || userId).toLowerCase();
            
            let isAdmin = adminKeywords.some(keyword => name.includes(keyword) || userId.toLowerCase().includes(keyword));
            
            if (!isAdmin) {
                userCount++;
                let money = Number(u.money || u.sodu || u.vnd || u.balance || 0);
                totalMoney += money;
            }
        }

        totalUsersEl.innerText = userCount;
        totalRevenueEl.innerText = totalMoney.toLocaleString('vi-VN') + 'đ';
    }

    // --- AI PHÂN TÍCH BIẾN ĐỘNG NHÁNH USERS ---
    function detectUserChanges(oldUsers, newUsers) {
        for (let userId in newUsers) {
            let oldUser = oldUsers[userId];
            let newUser = newUsers[userId];

            if (!oldUser) {
                let name = newUser.username || newUser.name || userId;
                let isAdmin = adminKeywords.some(keyword => name.toLowerCase().includes(keyword));
                if(!isAdmin) {
                    pushAiLog('system', `👥 <strong>Thành viên mới:</strong> Tài khoản <span class="hl-user">${name}</span> vừa tham gia hệ thống.`);
                }
                continue;
            }

            let name = newUser.username || newUser.name || userId;
            let isAdmin = adminKeywords.some(keyword => name.toLowerCase().includes(keyword));

            // Chỉ xử lý dòng tiền của Khách hàng, loại trừ Admin
            if (!isAdmin) {
                let oldBal = Number(oldUser.money || oldUser.sodu || oldUser.vnd || oldUser.balance || 0);
                let newBal = Number(newUser.money || newUser.sodu || newUser.vnd || newUser.balance || 0);

                if (oldBal !== newBal) {
                    let diff = newBal - oldBal;
                    if (diff > 0) {
                        pushAiLog('money-up', `✅ <strong>Duyệt tiền thành công:</strong> Admin đã phê duyệt lệnh cộng tiền cho tài khoản <span class="hl-user">${name}</span>. Số dư tăng thêm: <span class="hl-money">+${diff.toLocaleString()}đ</span>.`);
                    } else {
                        pushAiLog('money-down', `💸 <strong>Khách mua dịch vụ:</strong> Tài khoản khách hàng <span class="hl-user">${name}</span> vừa thanh toán đơn hàng thành công, ví tài khoản khấu trừ <span class="hl-admin">${Math.abs(diff).toLocaleString()}đ</span>.`);
                    }
                }
            }
        }
    }

    function checkInitialSystem() {
        if (!isFirstLoadUsers && !isFirstLoadKeys && savedLogs.length === 0) {
            pushAiLog('system', 'Hệ thống luồng dữ liệu riêng biệt đã cấu hình xong. AI đang túc trực trực tiếp tại nhánh users và purchased_keys.');
        }
    }

    // Hàm xuất log và nạp vào LocalStorage vĩnh viễn không mất chữ
    function pushAiLog(type, text) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString() + ' | ' + now.toLocaleDateString();
        
        const logData = { type, text, time: timeStr };
        savedLogs.unshift(logData);
        localStorage.setItem('shopmduy_ai_v4_logs', JSON.stringify(savedLogs));

        renderSingleLog(logData, true);
    }

    function renderSingleLog(log, isNew = false) {
        const emptyEl = document.querySelector('.empty');
        if (emptyEl) emptyEl.remove();

        const item = document.createElement('div');
        item.className = `log-item ${log.type}`;
        if (isNew) item.style.animation = "fadeIn 0.2s ease";

        item.innerHTML = `
            <div class="log-meta">
                <span>🤖 TRỢ LÝ GIÁM SÁT REALTIME AI</span>
                <span>${log.time}</span>
            </div>
            <div class="log-text">${log.text}</div>
        `;

        if (isNew) {
            logListEl.insertBefore(item, logListEl.firstChild);
        } else {
            logListEl.appendChild(item);
        }
    }

    function renderSavedLogs() {
        if (savedLogs.length > 0) {
            logListEl.innerHTML = '';
            savedLogs.forEach(log => renderSingleLog(log, false));
        }
    }

    document.getElementById('clear-btn').addEventListener('click', () => {
        if (confirm('Bạn muốn dọn sạch nhật ký AI hiển thị trên màn hình chứ?')) {
            localStorage.removeItem('shopmduy_ai_v4_logs');
            savedLogs = [];
            logListEl.innerHTML = '<div class="empty">Nhật ký trống. Đang chờ biến động nạp/mua thực tế từ Firebase...</div>';
        }
    });
</script>

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</body>
</html>
