<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a1a">
<title>💳 Mẫu CK - WebClip</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 50%, #0a0a1a 100%);
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
}
body {
    padding: 14px;
    padding-bottom: 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.header {
    width: 100%;
    max-width: 500px;
    text-align: center;
    margin-bottom: 16px;
}
.header h1 {
    font-size: 22px;
    font-weight: 900;
    background: linear-gradient(135deg, #a855f7, #ec4899, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
}
.header p {
    font-size: 11px;
    color: #888;
    margin-top: 4px;
}

/* DANH SÁCH MẪU */
.templates {
    width: 100%;
    max-width: 500px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 12px;
    scrollbar-width: none;
}
.templates::-webkit-scrollbar { display: none; }

.tpl-chip {
    flex-shrink: 0;
    padding: 8px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 20px;
    color: #ccc;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: 0.2s;
}
.tpl-chip:hover { border-color: #a855f7; color: #fff; }
.tpl-chip.active {
    background: linear-gradient(135deg, #a855f7, #ec4899);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 15px rgba(168,85,247,0.4);
}

/* CARD */
.card {
    width: 100%;
    max-width: 500px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    backdrop-filter: blur(10px);
}

/* FORM */
.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }

.field label {
    display: block;
    font-size: 10px;
    font-weight: 800;
    color: #a855f7;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.field input,
.field textarea {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 10px;
    color: #fff;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: 0.2s;
    -webkit-appearance: none;
}
.field input:focus,
.field textarea:focus {
    border-color: #a855f7;
    box-shadow: 0 0 15px rgba(168,85,247,0.3);
    background: rgba(0,0,0,0.6);
}
.field textarea {
    resize: vertical;
    min-height: 60px;
    font-size: 13px;
    line-height: 1.5;
}

/* PREVIEW */
.preview {
    width: 100%;
    max-width: 500px;
    background: linear-gradient(135deg, rgba(34,197,94,0.1), rgba(59,130,246,0.1));
    border: 1px solid rgba(34,197,94,0.4);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
}

.preview-title {
    font-size: 10px;
    font-weight: 800;
    color: #22c55e;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.preview-content {
    background: rgba(0,0,0,0.4);
    border-radius: 10px;
    padding: 12px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.7;
    color: #e0e0ff;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 60px;
}

.preview-content .highlight {
    color: #fbbf24;
    font-weight: 800;
}
.preview-content .key {
    color: #a855f7;
    font-weight: 700;
}

/* BOTTOM ACTIONS */
.actions {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px 14px;
    background: linear-gradient(0deg, #0a0a1a 70%, transparent);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    z-index: 100;
    max-width: 500px;
    margin: 0 auto;
}

.btn {
    padding: 13px 8px;
    border: none;
    border-radius: 10px;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    white-space: nowrap;
    -webkit-appearance: none;
}
.btn:active { transform: scale(0.96); }

.btn-copy {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #fff;
    box-shadow: 0 4px 15px rgba(34,197,94,0.3);
}
.btn-save {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    box-shadow: 0 4px 15px rgba(59,130,246,0.3);
}
.btn-share {
    background: linear-gradient(135deg, #a855f7, #ec4899);
    color: #fff;
    box-shadow: 0 4px 15px rgba(168,85,247,0.3);
}

/* TOAST */
.toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: #22c55e;
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-weight: 800;
    font-size: 13px;
    z-index: 9999;
    box-shadow: 0 8px 24px rgba(34,197,94,0.4);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: #ef4444; box-shadow: 0 8px 24px rgba(239,68,68,0.4); }

/* QR MODAL */
.modal {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9998;
    padding: 20px;
}
.modal.show { display: flex; }
.modal-content {
    background: #0a0a1a;
    border: 2px solid #a855f7;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    max-width: 320px;
    width: 100%;
}
.modal-content img {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 12px;
    background: #fff;
    padding: 10px;
}
.modal-content button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="header">
    <h1>💳 MẪU CHUYỂN KHOẢN</h1>
    <p>Chọn mẫu → Điền → Copy & Gửi</p>
</div>

<!-- CHIP CHỌN MẪU -->
<div class="templates" id="templates"></div>

<!-- FORM -->
<div class="card">
    <div class="field">
        <label>💰 Số tiền</label>
        <input type="text" id="amount" placeholder="VD: 500.000" inputmode="numeric">
    </div>
    
    <div class="field">
        <label>📝 Nội dung chuyển khoản</label>
        <input type="text" id="content" placeholder="VD: Tra tien hang thang 10">
    </div>
    
    <div class="field">
        <label>🏦 Ngân hàng</label>
        <input type="text" id="bank" placeholder="VD: Vietcombank">
    </div>
    
    <div class="field">
        <label>👤 Số tài khoản / Tên</label>
        <input type="text" id="account" placeholder="VD: 0123456789 - NGUYEN VAN A">
    </div>
    
    <div class="field">
        <label>📱 Số điện thoại / STK nhận</label>
        <input type="text" id="phone" placeholder="VD: 0328033706">
    </div>
    
    <div class="field">
        <label>📌 Ghi chú thêm</label>
        <textarea id="note" placeholder="Ghi chú..."></textarea>
    </div>
</div>

<!-- PREVIEW -->
<div class="preview">
    <div class="preview-title">👁️ XEM TRƯỚC NỘI DUNG</div>
    <div class="preview-content" id="preview">Chọn mẫu và điền thông tin...</div>
</div>

<!-- ACTIONS -->
<div class="actions">
    <button class="btn btn-copy" id="copy-btn">📋 COPY</button>
    <button class="btn btn-save" id="save-btn">💾 LƯU</button>
    <button class="btn btn-share" id="share-btn">📤 SHARE</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast">Đã copy!</div>

<!-- QR MODAL -->
<div class="modal" id="qr-modal">
    <div class="modal-content">
        <div style="font-size: 40px; margin-bottom: 8px;">📱</div>
        <div style="font-size: 14px; font-weight: 800; color: #a855f7; margin-bottom: 12px;">QR CHUYỂN KHOẢN</div>
        <img id="qr-img" src="" alt="QR">
        <button onclick="document.getElementById('qr-modal').classList.remove('show')">ĐÓNG</button>
    </div>
</div>

<script>
(function() {
    'use strict';

    var $ = function(id) { return document.getElementById(id); };

    // ═══════════════════════════════════════════════
    // CONFIG — CÁC MẪU CHUYỂN KHOẢN
    // ═══════════════════════════════════════════════
    var CONFIG = {
        templates: [
            {
                id: 'default',
                name: '📋 Mẫu cơ bản',
                icon: '💳',
                amount: '500.000',
                content: 'Chuyen tien',
                bank: 'Vietcombank',
                account: '0123456789 - NGUYEN VAN A',
                phone: '0328033706',
                note: ''
            },
            {
                id: 'shop',
                name: '🛍️ Trả tiền hàng',
                icon: '🛍️',
                amount: '200.000',
                content: 'Tra tien don hang',
                bank: 'Techcombank',
                account: '19001234567890 - SHOP ABC',
                phone: '0328033706',
                note: 'Cảm ơn bạn đã mua hàng!'
            },
            {
                id: 'service',
                name: '🔧 Thanh toán dịch vụ',
                icon: '🔧',
                amount: '1.000.000',
                content: 'Thanh toan dich vu thang',
                bank: 'VPBank',
                account: '0123456789 - CONG TY XYZ',
                phone: '0328033706',
                note: ''
            },
            {
                id: 'salary',
                name: '💼 Trả lương',
                icon: '💼',
                amount: '5.000.000',
                content: 'Luong thang 10',
                bank: 'BIDV',
                account: '1234567890 - NGUYEN VAN A',
                phone: '0328033706',
                note: 'Lương tháng này'
            },
            {
                id: 'personal',
                name: '👨‍👩‍👧 Cá nhân',
                icon: '❤️',
                amount: '100.000',
                content: 'Chuyen tien ca nhan',
                bank: 'Viettinbank',
                account: '0123456789 - NGUYEN VAN A',
                phone: '0328033706',
                note: ''
            },
            {
                id: 'momo',
                name: '💜 Ví MoMo',
                icon: '💜',
                amount: '50.000',
                content: 'Chuyen tien MoMo',
                bank: 'Ví MoMo',
                account: '0328033706',
                phone: '0328033706',
                note: ''
            }
        ],
        currentTpl: 'default'
    };

    // ═══════════════════════════════════════════════
    // RENDER TEMPLATES
    // ═══════════════════════════════════════════════
    function renderTemplates() {
        var container = $('templates');
        container.innerHTML = '';
        CONFIG.templates.forEach(function(tpl) {
            var chip = document.createElement('div');
            chip.className = 'tpl-chip' + (tpl.id === CONFIG.currentTpl ? ' active' : '');
            chip.textContent = tpl.name;
            chip.setAttribute('data-id', tpl.id);
            chip.onclick = function() { loadTemplate(tpl.id); };
            container.appendChild(chip);
        });
    }

    // ═══════════════════════════════════════════════
    // LOAD TEMPLATE
    // ═══════════════════════════════════════════════
    function loadTemplate(id) {
        var tpl = CONFIG.templates.find(function(t) { return t.id === id; });
        if (!tpl) return;

        CONFIG.currentTpl = id;

        $('amount').value = tpl.amount || '';
        $('content').value = tpl.content || '';
        $('bank').value = tpl.bank || '';
        $('account').value = tpl.account || '';
        $('phone').value = tpl.phone || '';
        $('note').value = tpl.note || '';

        document.querySelectorAll('.tpl-chip').forEach(function(c) {
            c.classList.toggle('active', c.getAttribute('data-id') === id);
        });

        updatePreview();
        saveToLocal();
        toast('Đã chọn: ' + tpl.name);
    }

    // ═══════════════════════════════════════════════
    // PREVIEW
    // ═══════════════════════════════════════════════
    function updatePreview() {
        var amount = $('amount').value || '—';
        var content = $('content').value || '—';
        var bank = $('bank').value || '—';
        var account = $('account').value || '—';
        var phone = $('phone').value || '—';
        var note = $('note').value;

        var text = '';
        text += '<span class="key">Số tiền:</span> <span class="highlight">' + amount + ' VNĐ</span>\n';
        text += '<span class="key">Nội dung CK:</span> ' + content + '\n';
        text += '<span class="key">Ngân hàng:</span> ' + bank + '\n';
        text += '<span class="key">Số TK:</span> ' + account + '\n';
        text += '<span class="key">STK nhận:</span> ' + phone;
        if (note) {
            text += '\n\n<span class="key">Ghi chú:</span> ' + note;
        }

        $('preview').innerHTML = text;
    }

    // ═══════════════════════════════════════════════
    // SAVE / LOAD LOCAL
    // ═══════════════════════════════════════════════
    function saveToLocal() {
        try {
            var data = {
                currentTpl: CONFIG.currentTpl,
                amount: $('amount').value,
                content: $('content').value,
                bank: $('bank').value,
                account: $('account').value,
                phone: $('phone').value,
                note: $('note').value
            };
            localStorage.setItem('ck_webclip_data', JSON.stringify(data));
        } catch(e) {}
    }

    function loadFromLocal() {
        try {
            var raw = localStorage.getItem('ck_webclip_data');
            if (!raw) return false;
            var data = JSON.parse(raw);
            CONFIG.currentTpl = data.currentTpl || 'default';
            $('amount').value = data.amount || '';
            $('content').value = data.content || '';
            $('bank').value = data.bank || '';
            $('account').value = data.account || '';
            $('phone').value = data.phone || '';
            $('note').value = data.note || '';
            return true;
        } catch(e) { return false; }
    }

    // ═══════════════════════════════════════════════
    // TOAST
    // ═══════════════════════════════════════════════
    var toastTimer = null;
    function toast(text, isError) {
        var el = $('toast');
        el.textContent = text;
        el.className = 'toast' + (isError ? ' error' : '') + ' show';
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function() {
            el.classList.remove('show');
        }, 2000);
    }

    // ═══════════════════════════════════════════════
    // COPY
    // ═══════════════════════════════════════════════
    function getPlainText() {
        var amount = $('amount').value || '—';
        var content = $('content').value || '—';
        var bank = $('bank').value || '—';
        var account = $('account').value || '—';
        var phone = $('phone').value || '—';
        var note = $('note').value;

        var text = '';
        text += '💳 THÔNG TIN CHUYỂN KHOẢN\n';
        text += '━━━━━━━━━━━━━━━━━━━\n';
        text += '💰 Số tiền: ' + amount + ' VNĐ\n';
        text += '📝 Nội dung CK: ' + content + '\n';
        text += '🏦 Ngân hàng: ' + bank + '\n';
        text += '👤 Số TK: ' + account + '\n';
        text += '📱 STK nhận: ' + phone;
        if (note) {
            text += '\n\n📌 Ghi chú: ' + note;
        }
        return text;
    }

    $('copy-btn').onclick = function() {
        var text = getPlainText();
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function() {
                toast('✅ Đã copy!');
            }).catch(function() {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    };

    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            toast('✅ Đã copy!');
        } catch(e) {
            toast('❌ Không copy được', true);
        }
        document.body.removeChild(ta);
    }

    // ═══════════════════════════════════════════════
    // SAVE FILE
    // ═══════════════════════════════════════════════
    $('save-btn').onclick = function() {
        var text = getPlainText();
        var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'chuyen-khoan-' + Date.now() + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('💾 Đã lưu file!');
    };

    // ═══════════════════════════════════════════════
    // SHARE
    // ═══════════════════════════════════════════════
    $('share-btn').onclick = function() {
        var text = getPlainText();
        if (navigator.share) {
            navigator.share({
                title: 'Thông tin chuyển khoản',
                text: text
            }).then(function() {
                toast('📤 Đã chia sẻ!');
            }).catch(function() {});
        } else {
            fallbackCopy(text);
            toast('📋 Đã copy (không hỗ trợ share)');
        }
    };

    // ═══════════════════════════════════════════════
    // AUTO SAVE KHI NHẬP
    // ═══════════════════════════════════════════════
    ['amount', 'content', 'bank', 'account', 'phone', 'note'].forEach(function(id) {
        var el = $(id);
        if (el) {
            el.addEventListener('input', function() {
                updatePreview();
                saveToLocal();
            });
        }
    });

    // ═══════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════
    renderTemplates();

    // Load từ localStorage hoặc template mặc định
    if (!loadFromLocal()) {
        loadTemplate('default');
    } else {
        // Update chip active
        document.querySelectorAll('.tpl-chip').forEach(function(c) {
            c.classList.toggle('active', c.getAttribute('data-id') === CONFIG.currentTpl);
        });
    }
    updatePreview();

    console.log('%c💳 WebClip Chuyển Khoản đã sẵn sàng!', 'color: #22c55e; font-size: 14px; font-weight: bold;');
    console.log('📋 Có ' + CONFIG.templates.length + ' mẫu sẵn sàng');

})();
</script>

</body>
</html>
