<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Server Monitor - Toàn Bộ Giao Dịch</title>
    <style>
        :root {
            --bg-color: #060814;
            --card-bg: #0b1120;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 24px; color: var(--primary); }
        
        /* Khu vực thống kê số dư */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .stat-title { font-size: 12px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 24px; font-weight: bold; margin-top: 5px; font-family: monospace; }
        .stat-value.total { color: var(--success); }
        .stat-value.admin { color: var(--danger); }

        .main-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h2 { font-size: 16px; color: var(--primary); margin: 0; }
        
        .btn-clear {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-clear:hover { background: var(--danger); color: #fff; }

        /* Danh sách Log AI */
        .log-list {
            max-height: 550px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .log-item {
            background: rgba(255, 255, 255, 0.02);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 4px;
        }
        .log-item.approved { border-left-color: var(--success); background: rgba(16, 185, 129, 0.03); }
        .log-item.system { border-left-color: #a855f7; background: rgba(168, 85, 247, 0.03); }
        
        .log-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
        .log-text { font-size: 14px; line-height: 1.5; }
        
        /* Highlight chữ */
        .hl-admin { color: #f43f5e; font-weight: bold; }
        .hl-user { color: #38bdf8; font-weight: bold; }
        .hl-money { color: #10b981; font-weight: bold; }
        .hl-info { color: #e2e8f0; font-weight: bold; }

        .empty { text-align: center; color: var(--text-sub); padding: 40px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>M.DUY AI LIVE MONITOR</h1>
            <div style="font-size: 12px; color: var(--text-sub);">Dữ liệu tổng hợp từ trước đến nay + Thời gian thực</div>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="stat-card">
            <div class="stat-title">💰 TỔNG TIỀN ĐÃ DUYỆT (TẤT CẢ TỪ TRƯỚC TỚI GIỜ)</div>
            <div id="total-approved" class="stat-value total">0đ</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">👑 VÍ ADMIN TRỪ RA (KHÔNG TÍNH VÀO TỔNG)</div>
            <div id="admin-balance" class="stat-value admin">0đ</div>
        </div>
    </div>

    <div class="main-card">
        <div class="card-header">
            <h2>🤖 NHẬT KÝ BIẾN ĐỘNG THỜI GIAN THỰC (LƯU VĨNH VIỄN)</h2>
            <button class="btn-clear" id="clear-btn">Xóa nhật ký biến động</button>
        </div>
        <div id="log-list" class="log-list">
            <div class="empty">Đang kết nối cơ sở dữ liệu và quét lịch sử giao dịch...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const logListEl = document.getElementById('log-list');
    const totalApprovedEl = document.getElementById('total-approved');
    const adminBalanceEl = document.getElementById('admin-balance');

    let oldData = null;
    let isFirstLoad = true;
    let savedLogs = JSON.parse(localStorage.getItem('duy_ai_total_logs')) || [];

    // Hiển thị lại nhật ký cũ từ LocalStorage (nếu có)
    renderSavedLogs();

    // Đồng bộ thời gian thực từ Firebase Gốc
    onValue(ref(db, '/'), (snapshot) => {
        const newData = snapshot.val();

        // 👉 HÀNH ĐỘNG 1: Quét TOÀN BỘ database từ quá khứ đến hiện tại để tính tổng tiền
        calculateAllFinancials(newData);

        // Nếu là lần đầu load trang (hoặc F5), chỉ cập nhật số tiền tổng và gán mốc dữ liệu gốc, không ghi log báo cáo trùng
        if (isFirstLoad) {
            oldData = JSON.parse(JSON.stringify(newData));
            isFirstLoad = false;
            if(savedLogs.length === 0) {
                pushAiLog('system', 'Hệ thống AI đã quét xong toàn bộ dữ liệu từ trước tới nay trên Firebase. Ô thống kê phía trên đã hiển thị chính xác tổng tiền giao dịch.');
            }
            return;
        }

        // 👉 HÀNH ĐỘNG 2: Nếu có biến động mới sau khi mở web, AI lập tức phân tích và báo cáo
        deepAnalyzeChanges(oldData, newData);

        // Lưu dữ liệu để so sánh cho lần tiếp theo
        oldData = JSON.parse(JSON.stringify(newData));
    });

    // 🌟 THUẬT TOÁN QUÉT TỔNG TIỀN TỪ TRƯỚC ĐẾN NAY (ĐỆ QUY TOÀN BỘ NODE)
    function calculateAllFinancials(data) {
        if (!data) return;
        
        let totalApproved = 0;
        let adminMoney = 0;

        // Các từ khóa nhận diện tài khoản Admin để trừ ra không cộng dồn vào tổng
        const adminKeywords = ['admin', 'mduy', 'shopmduy', 'root', 'quanly'];

        function scanDeep(obj, parentKey = '') {
            if (!obj || typeof obj !== 'object') return;

            // Kiểm tra nếu node này chứa dữ liệu của 1 giao dịch và trạng thái là thành công/đã duyệt
            const isApproved = obj.status === 'success' || obj.status === 'đã duyệt' || obj.status === 'approved' || obj.trangthai === 'thành công';
            if (isApproved) {
                let money = obj.money || obj.sodu || obj.amount || obj.sotien || 0;
                totalApproved += Number(money);
            }

            // Quét các nhánh con
            for (let k in obj) {
                if (typeof obj[k] === 'object' && obj[k] !== null) {
                    // Nếu nhánh này là tài khoản Admin, lấy tiền của Admin bỏ riêng ra ô bên cạnh
                    let isAdminNode = adminKeywords.some(keyword => k.toLowerCase().includes(keyword) || parentKey.toLowerCase().includes(keyword));
                    if (isAdminNode) {
                        let moneyAdmin = obj[k].money || obj[k].sodu || obj[k].balance || 0;
                        adminMoney += Number(moneyAdmin);
                    }
                    scanDeep(obj[k], k);
                }
            }
        }

        scanDeep(data);

        // Cập nhật số liệu hiển thị lên giao diện (Định dạng tiền Việt Nam)
        totalApprovedEl.innerText = totalApproved.toLocaleString('vi-VN') + 'đ';
        adminBalanceEl.innerText = adminMoney.toLocaleString('vi-VN') + 'đ';
    }

    // 🧠 AI SO SÁNH VÀ BÁO CÁO CHI TIẾT KHI CÓ BIẾN ĐỘNG THỜI GIAN THỰC
    function deepAnalyzeChanges(oldObj, newObj) {
        if (!newObj || !oldObj) return;

        function compareNodes(oldNode, newNode) {
            if (typeof newNode !== 'object' || !newNode || !oldNode) return;

            for (let key in newNode) {
                // 1. Trường hợp: Có giao dịch mới vừa được tạo và đã được duyệt ngay lập tức
                if (!oldNode[key]) {
                    let item = newNode[key];
                    if (item && (item.status === 'success' || item.status === 'đã duyệt')) {
                        let target = item.username || item.name || item.user || 'Người dùng';
                        let amount = item.money || item.amount || item.sotien || 0;
                        let lyDo = item.note || item.reason || 'Nạp tiền';
                        
                        pushAiLog('approved', `🎉 <strong>Giao dịch mới phát sinh:</strong> Hệ thống vừa ghi nhận một giao dịch mới từ trước tới giờ đã được duyệt thành công. Khách hàng: <span class="hl-user">${target}</span>. Số tiền: <span class="hl-money">${Number(amount).toLocaleString()}đ</span>. Nội dung: <span class="hl-info">${lyDo}</span>.`);
                    }
                } else {
                    // 2. Trường hợp: Giao dịch cũ đang từ "Chờ duyệt" chuyển sang "Đã duyệt thành công"
                    let oldSub = oldNode[key];
                    let newSub = newNode[key];

                    if (typeof newSub === 'object' && oldSub) {
                        let oldStatus = oldSub.status || oldSub.trangthai;
                        let newStatus = newSub.status || newSub.trangthai;

                        if (oldStatus !== newStatus && (newStatus === 'success' || newStatus === 'đã duyệt')) {
                            let target = newSub.username || newSub.name || newSub.user || key;
                            let amount = newSub.money || newSub.amount || newSub.sotien || 0;
                            let adminName = newSub.handler || newSub.admin || 'Admin Hệ Thống';
                            
                            pushAiLog('approved', `✅ <strong>Hành vi duyệt tiền:</strong> Quản trị viên <span class="hl-admin">${adminName}</span> vừa thực hiện thao tác duyệt tiền thành công cho tài khoản <span class="hl-user">${target}</span>. Số tiền thực nhận: <span class="hl-money">${Number(amount).toLocaleString()}đ</span>. Hệ thống đã đồng bộ hóa dữ liệu.`);
                        }
                    }
                    // Tiếp tục quét sâu vào bên trong cấu trúc cây dữ liệu
                    compareNodes(oldNode[key], newNode[key]);
                }
            }
        }
        compareNodes(oldObj, newObj);
    }

    // Ghi Log, đẩy lên màn hình và lưu trực tiếp vào LocalStorage (Bảo lưu khi đóng tab)
    function pushAiLog(type, text) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString() + ' | ' + now.toLocaleDateString();
        
        const logData = { type, text, time: timeStr };
        savedLogs.unshift(logData);
        localStorage.setItem('duy_ai_total_logs', JSON.stringify(savedLogs));

        renderSingleLog(logData, true);
    }

    function renderSingleLog(log, isNew = false) {
        const emptyEl = document.querySelector('.empty');
        if (emptyEl) emptyEl.remove();

        const item = document.createElement('div');
        item.className = `log-item ${log.type}`;
        if (isNew) item.style.animation = "fadeIn 0.3s ease";

        item.innerHTML = `
            <div class="log-meta">
                <span>🤖 TRỢ LÝ GIÁM SÁT AI</span>
                <span>${log.time}</span>
            </div>
            <div class="log-text">${log.text}</div>
        `;

        if (isNew) {
            logListEl.insertBefore(item, logListEl.firstChild);
        } else {
            logListEl.appendChild(item);
        }
    }

    function renderSavedLogs() {
        if (savedLogs.length > 0) {
            logListEl.innerHTML = '';
            savedLogs.forEach(log => renderSingleLog(log, false));
        }
    }

    // Nút xóa lịch sử biến động trên màn hình
    document.getElementById('clear-btn').addEventListener('click', () => {
        if (confirm('Bạn muốn dọn dẹp các dòng thông báo biến động này không? (Tổng số tiền giao dịch trên bảng điều khiển vẫn giữ nguyên)')) {
            localStorage.removeItem('duy_ai_total_logs');
            savedLogs = [];
            logListEl.innerHTML = '<div class="empty">Nhật ký trống. Đang chờ biến động thời gian thực...</div>';
        }
    });
</script>

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</body>
</html>
