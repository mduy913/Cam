<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 350px; font-family: Arial, sans-serif; padding: 10px; margin: 0; }
    h3 { color: #0084FF; margin-top: 0; }
    textarea { width: 100%; height: 100px; font-family: monospace; font-size: 11px; margin-bottom: 10px; resize: vertical; }
    button { background: #0084FF; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; width: 100%; }
    button:hover { background: #0066CC; }
  </style>
</head>
<body>
  <h3>MDUYK ZALO UTILS</h3>
  <label><b>IMEI:</b></label>
  <textarea id="imeiBox" readonly placeholder="Đang tải..."></textarea>
  
  <label><b>Cookie JSON:</b></label>
  <textarea id="cookieBox" readonly placeholder="Đang tải..."></textarea>
  
  <button id="btnCopy">Copy tất cả thông tin</button>

  <script>
    // Hàm chạy trực tiếp trên trang Zalo để lấy dữ liệu công khai của tab đó
    function getZaloData() {
      let cookies = document.cookie.split(';').reduce((res, c) => {
          let [key, val] = c.trim().split('=');
          if (key) res[key] = decodeURIComponent(val);
          return res;
      }, {});
      let imei = window.localStorage.getItem('zalo_imei') || window.localStorage.getItem('z_uuid') || "Không tìm thấy";
      return { imei, cookies };
    }

    // Khi popup mở ra, yêu cầu trình duyệt đọc dữ liệu từ trang web hiện tại
    chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
      let activeTab = tabs[0];
      if (!activeTab.url.includes("zalo.me")) {
        document.body.innerHTML = "<h3>Lỗi: Hãy mở trang chat.zalo.me trước!</h3>";
        return;
      }

      chrome.scripting.executeScript({
        target: { tabId: activeTab.id },
        func: getZaloData
      }, (results) => {
        if (results && results[0]) {
          const data = results[0].result;
          document.getElementById('imeiBox').value = data.imei;
          document.getElementById('cookieBox').value = JSON.stringify(data.cookies, null, 2);
          
          // Nút bấm copy nhanh
          document.getElementById('btnCopy').addEventListener('click', () => {
            let fullText = `IMEI:\n${data.imei}\n\nCOOKIE:\n${JSON.stringify(data.cookies)}`;
            navigator.clipboard.writeText(fullText);
            alert("Đã copy toàn bộ thông tin vào khay nhớ tạm!");
          });
        }
      });
    });
  </script>
</body>
</html>
