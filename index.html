<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOPMDUY AI MONITOR - TỔNG KẾT DOANH THU</title>
    <style>
        :root {
            --bg-color: #060814;
            --card-bg: #0b1120;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 24px; color: var(--primary); letter-spacing: 0.5px; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .stat-title { font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 28px; font-weight: bold; margin-top: 5px; font-family: monospace; }
        .stat-value.total { color: var(--success); }
        .stat-value.users { color: var(--primary); }

        .main-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h2 { font-size: 15px; color: var(--primary); margin: 0; }
        
        .btn-clear {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-clear:hover { background: var(--danger); color: #fff; }

        .log-list {
            max-height: 550px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .log-item {
            background: rgba(255, 255, 255, 0.01);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 4px;
        }
        .log-item.money-up { border-left-color: var(--success); background: rgba(16, 185, 129, 0.02); }
        .log-item.money-down { border-left-color: var(--warning); background: rgba(245, 158, 11, 0.02); }
        .log-item.key-action { border-left-color: #a855f7; background: rgba(168, 85, 247, 0.02); }
        
        .log-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
        .log-text { font-size: 14px; line-height: 1.5; }
        
        .hl-admin { color: #ff4d4d; font-weight: bold; }
        .hl-user { color: #38bdf8; font-weight: bold; }
        .hl-money { color: #10b981; font-weight: bold; }

        .empty { text-align: center; color: var(--text-sub); padding: 40px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SHOPMDUY AI LIVE MONITOR</h1>
        <div style="font-size: 12px; color: var(--text-sub); margin-top: 4px;">Hệ thống lưu giữ Tổng tiền nạp tích lũy - Đã loại trừ tài khoản Admin</div>
    </header>

    <div class="dashboard-grid">
        <div class="stat-card">
            <div class="stat-title">👥 TỔNG KHÁCH HÀNG (LOẠI TRỪ ADMIN)</div>
            <div id="total-users" class="stat-value users">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">📊 TỔNG TIỀN ĐÃ DUYỆT / NẠP (TÍCH LŨY MÃI MÃI)</div>
            <div id="total-revenue" class="stat-value total">0đ</div>
        </div>
    </div>

    <div class="main-card">
        <div class="card-header">
            <h2>🤖 BÁO CÁO HÀNH VI BIẾN ĐỘNG (LƯU VĨNH VIỄN)</h2>
            <button class="btn-clear" id="clear-btn">Xóa nhật ký AI</button>
        </div>
        <div id="log-list" class="log-list">
            <div class="empty">Hệ thống AI đang đọc dữ liệu lịch sử trên Firebase...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const logListEl = document.getElementById('log-list');
    const totalUsersEl = document.getElementById('total-users');
    const totalRevenueEl = document.getElementById('total-revenue');

    // Khởi tạo biến lưu trữ tổng tiền nạp vĩnh viễn vào bộ nhớ trình duyệt để không bị mất khi F5/đóng tab
    let accumulatedRevenue = Number(localStorage.getItem('shopmduy_total_revenue')) || 0;
    let savedLogs = JSON.parse(localStorage.getItem('shopmduy_ai_v2_logs')) || [];

    // Danh sách từ khóa nhận diện tài khoản Admin để trừ ra không tính tiền/không đếm thành viên thường
    const adminKeywords = ['admin', 'mduy', 'shopmduy', 'root', 'quanly'];

    let oldData = null;
    let isFirstLoad = true;

    // Hiển thị dữ liệu cũ đã lưu từ trước
    totalRevenueEl.innerText = accumulatedRevenue.toLocaleString('vi-VN') + 'đ';
    renderSavedLogs();

    // Lắng nghe Firebase
    onValue(ref(db, '/'), (snapshot) => {
        const newData = snapshot.val() || {};

        // 1. Quét số lượng khách hàng thực tế (Bỏ qua tài khoản Admin)
        countRealUsers(newData.users);

        if (isFirstLoad) {
            oldData = JSON.parse(JSON.stringify(newData));
            isFirstLoad = false;
            if(savedLogs.length === 0) {
                pushAiLog('system', 'Hệ thống AI khởi động thành công. Đang giữ mốc số liệu tổng kết và sẵn sàng báo cáo khi có dòng tiền mới.');
            }
            return;
        }

        // 2. Phân tích biến động thời gian thực
        detectShopChanges(oldData, newData);

        oldData = JSON.parse(JSON.stringify(newData));
    });

    // 👥 HÀM ĐẾM THÀNH VIÊN (LOẠI TRỪ ADMIN)
    function countRealUsers(usersNode) {
        if (!usersNode) return;
        let userCount = 0;

        for (let userId in usersNode) {
            let u = usersNode[userId];
            let name = (u.username || u.name || userId).toLowerCase();
            
            // Nếu không trùng từ khóa Admin thì mới đếm
            let isAdmin = adminKeywords.some(keyword => name.includes(keyword));
            if (!isAdmin) {
                userCount++;
            }
        }
        totalUsersEl.innerText = userCount;
    }

    // 🧠 AI ĐỌC DÒNG TIỀN NẠP VÀ CỘNG DỒN VĨNH VIỄN
    function detectShopChanges(oldObj, newObj) {
        if (!newObj.users || !oldObj.users) return;

        for (let userId in newObj.users) {
            let oldUser = oldObj.users[userId];
            let newUser = newObj.users[userId];

            if (!oldUser) {
                let name = newUser.username || newUser.email || newUser.name || userId;
                let isAdmin = adminKeywords.some(keyword => name.toLowerCase().includes(keyword));
                if(!isAdmin) {
                    pushAiLog('system', `👥 <strong>Thành viên mới:</strong> Khách hàng <span class="hl-user">${name}</span> vừa đăng ký tài khoản thành công.`);
                }
                continue;
            }

            let name = newUser.username || newUser.name || userId;
            // Kiểm tra xem tài khoản xảy ra biến động này có phải Admin không
            let isAdmin = adminKeywords.some(keyword => name.toLowerCase().includes(keyword));

            // Chỉ phân tích và xử lý nếu đây là tài khoản của KHÁCH HÀNG (Không phải Admin)
            if (!isAdmin) {
                let oldBal = Number(oldUser.money || oldUser.sodu || oldUser.vnd || oldUser.balance || 0);
                let newBal = Number(newUser.money || newUser.sodu || newUser.vnd || newUser.balance || 0);

                if (oldBal !== newBal) {
                    let diff = newBal - oldBal;
                    
                    if (diff > 0) {
                        // 👉 KHÁCH ĐƯỢC DUYỆT TIỀN: Cộng dồn thẳng vào Tổng Tiền Tích Lũy
                        accumulatedRevenue += diff;
                        localStorage.setItem('shopmduy_total_revenue', accumulatedRevenue);
                        totalRevenueEl.innerText = accumulatedRevenue.toLocaleString('vi-VN') + 'đ';

                        pushAiLog('money-up', `✅ <strong>Duyệt tiền thành công:</strong> Admin vừa duyệt cộng tiền cho tài khoản <span class="hl-user">${name}</span>. Số tiền nạp: <span class="hl-money">+${diff.toLocaleString()}đ</span>. Hệ thống đã cộng dồn vào doanh thu tổng.`);
                    } else {
                        // 👉 KHÁCH MUA HÀNG BỊ TRỪ TIỀN: Chỉ ghi nhận báo cáo hành vi, KHÔNG TRỪ vào ô Số Tiền Tổng kết
                        pushAiLog('money-down', `💸 <strong>Khách mua hàng:</strong> Tài khoản <span class="hl-user">${name}</span> vừa thanh toán đơn hàng, ví bị khấu trừ <span class="hl-admin">${Math.abs(diff).toLocaleString()}đ</span>. (Số dư hiện tại: ${newBal.toLocaleString()}đ).`);
                    }
                }
            }
        }

        // --- Kiểm tra kho Key và Hệ thống ---
        if (newObj.purchased_keys && oldObj.purchased_keys && Object.keys(newObj.purchased_keys).length > Object.keys(oldObj.purchased_keys).length) {
            pushAiLog('key-action', `🔑 <strong>Hệ thống kho:</strong> Đơn hàng đã hoàn tất giao dịch. Một Key bản quyền vừa được chuyển giao cho khách hàng.`);
        }
    }

    // Hàm xuất và lưu trữ log vĩnh viễn
    function pushAiLog(type, text) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString() + ' | ' + now.toLocaleDateString();
        
        const logData = { type, text, time: timeStr };
        savedLogs.unshift(logData);
        localStorage.setItem('shopmduy_ai_v2_logs', JSON.stringify(savedLogs));

        renderSingleLog(logData, true);
    }

    function renderSingleLog(log, isNew = false) {
        const emptyEl = document.querySelector('.empty');
        if (emptyEl) emptyEl.remove();

        const item = document.createElement('div');
        item.className = `log-item ${log.type}`;
        if (isNew) item.style.animation = "fadeIn 0.2s ease";

        item.innerHTML = `
            <div class="log-meta">
                <span>🤖 BÁO CÁO DÒNG TIỀN AI</span>
                <span>${log.time}</span>
            </div>
            <div class="log-text">${log.text}</div>
        `;

        if (isNew) {
            logListEl.insertBefore(item, logListEl.firstChild);
        } else {
            logListEl.appendChild(item);
        }
    }

    function renderSavedLogs() {
        if (savedLogs.length > 0) {
            logListEl.innerHTML = '';
            savedLogs.forEach(log => renderSingleLog(log, false));
        }
    }

    document.getElementById('clear-btn').addEventListener('click', () => {
        if (confirm('Bạn có muốn dọn dẹp danh sách thông báo của AI không? (Ô Tổng Tiền Nạp tích lũy vẫn sẽ được bảo lưu vĩnh viễn)')) {
            localStorage.removeItem('shopmduy_ai_v2_logs');
            savedLogs = [];
            logListEl.innerHTML = '<div class="empty">Nhật ký trống. Đang chờ biến động tiếp theo...</div>';
        }
    });
</script>

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</body>
</html>
