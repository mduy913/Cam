<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOPMDUY - TELEGRAM MASTER CONTROLLER</title>
    <style>
        :root {
            --bg-color: #05070f;
            --card-bg: #0c101f;
            --card-border: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #64748b;
            --primary: #38bdf8;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { border-bottom: 1px solid var(--card-border); padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 24px; color: var(--primary); font-weight: 700; }
        
        .status-bar { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,0.02); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--card-border); }
        .status-dot { width: 10px; height: 10px; background: var(--danger); border-radius: 50%; display: inline-block; transition: all 0.3s ease; }
        .status-dot.online { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .status-text { font-size: 12.5px; font-weight: bold; font-family: monospace; }

        .grid-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; }
        h2 { font-size: 14px; color: var(--primary); margin-top: 0; margin-bottom: 15px; text-transform: uppercase; }
        
        .search-input { width: 100%; background: #13192e; border: 1px solid var(--card-border); padding: 10px; border-radius: 6px; color: #fff; box-sizing: border-box; margin-bottom: 15px; }
        .user-list { max-height: 450px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .user-card { background: rgba(255,255,255,0.01); padding: 11px 14px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; border-left: 3px solid var(--text-sub); }
        .user-card.active-user { border-left-color: var(--primary); }
        .user-balance { font-family: monospace; color: var(--success); font-weight: bold; }
        
        .log-container { max-height: 480px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .log-card { background: rgba(255, 255, 255, 0.01); border-left: 4px solid var(--text-sub); padding: 12px 15px; border-radius: 6px; font-size: 13.5px; line-height: 1.5; }
        .log-card.tele-cmd { border-left-color: var(--warning); background: rgba(251, 191, 36, 0.02); }
        .log-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-bottom: 5px; }
        
        .hl-user-name { color: var(--primary); font-weight: bold; }
        .hl-money-up { color: var(--success); font-weight: bold; }
        .empty { text-align: center; color: var(--text-sub); padding: 40px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>SHOPMDUY AI TELEGRAM CONNECTOR (DIRECT)</h1>
            <div style="font-size: 12px; color: var(--text-sub); margin-top: 4px;">Chế độ: Kết nối trực tiếp siêu tốc (Bật Extension CORS Unblock)</div>
        </div>
        <div class="status-bar">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text" class="status-text">ĐANG KẾT NỐI TRỰC TIẾP...</span>
        </div>
    </header>

    <div class="grid-layout">
        <div class="box">
            <h2>👥 Số dư ví khách thực tế</h2>
            <input type="text" id="search-bar" class="search-input" placeholder="Tìm nhanh tên tài khoản...">
            <div id="user-list-target" class="user-list"><div class="empty">Đang tải danh sách ví...</div></div>
        </div>

        <div class="box" style="display: flex; flex-direction: column;">
            <h2>🤖 Nhật ký xử lý lệnh Telegram</h2>
            <div id="log-list-target" class="log-container"><div class="empty">Đang kết nối luồng quét tin nhắn siêu tốc...</div></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const TELEGRAM_TOKEN = "8314558446:AAECq0SeBmH_cDmYTpwS9pX0MgvaRlcgs9A";
    let lastUpdateId = 0;

    const userListTarget = document.getElementById('user-list-target');
    const logListTarget = document.getElementById('log-list-target');
    const searchBar = document.getElementById('search-bar');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    onValue(ref(db, 'users'), (snapshot) => {
        const users = snapshot.val() || {};
        let html = '';
        for (let id in users) {
            let u = users[id];
            let name = u.username || u.name || id;
            let bal = Number(u.balance || 0);
            html += `
                <div class="user-card active-user" data-search="${name.toLowerCase()}">
                    <span class="user-name">👤 ${name}</span>
                    <span class="user-balance">${bal.toLocaleString('vi-VN')}đ</span>
                </div>
            `;
        }
        userListTarget.innerHTML = html;
    });

    async function checkTelegramMessages() {
        try {
            const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=3`;
            const response = await fetch(url);
            
            if (response.ok) {
                const data = await response.json();
                statusDot.className = "status-dot online";
                statusText.innerText = "MDUY_BOT: ONLINE THẲNG - ỔN ĐỊNH 100%";

                if (data.ok && data.result && data.result.length > 0) {
                    for (let updateObj of data.result) {
                        lastUpdateId = updateObj.update_id;
                        if (updateObj.message && updateObj.message.text) {
                            await handleAdminCommand(updateObj.message.chat.id, updateObj.message.text.trim());
                        }
                    }
                }
            }
        } catch (err) {
            console.error("Lỗi:", err);
            statusDot.className = "status-dot";
            statusText.innerText = "LỖI: HÃY KIỂM TRA EXTENSION CORS UNBLOCK ĐÃ BẬT CHƯA?";
        }
        setTimeout(checkTelegramMessages, 1500);
    }

    async function handleAdminCommand(chatId, text) {
        const textLower = text.toLowerCase();

        // 🟢 CÚ PHÁP 1: Cộng tiền
        if (textLower.startsWith("cong tien") || textLower.startsWith("cộng tiền")) {
            let parts = text.split(/\s+/);
            if (parts.length < 4) {
                sendTelegramMessage(chatId, "❌ Cú pháp chuẩn sếp ơi: <code>Cộng tiền [tên_tk] [số_tiền]</code>\nVí dụ: <code>Cộng tiền mduy99 50k</code>");
                return;
            }

            let targetUser = parts[2];
            let moneyStr = parts[3].toLowerCase();
            let amount = moneyStr.includes('k') ? Number(moneyStr.replace('k', '')) * 1000 : Number(moneyStr);

            if (isNaN(amount) || amount <= 0) {
                sendTelegramMessage(chatId, "❌ Số tiền không đúng sếp ơi!");
                return;
            }

            const userRef = ref(db, `users/${targetUser}`);
            const snapshot = await get(userRef);

            if (snapshot.exists()) {
                let currentBal = Number(snapshot.val().balance || 0);
                let newBal = currentBal + amount;

                await update(ref(db), { [`users/${targetUser}/balance`]: newBal });
                
                pushLog(`💬 Bạn đã cộng tiền cho tài khoản <span class="hl-user-name">${targetUser}</span> <span class="hl-money-up">+${amount.toLocaleString()}đ</span>.`);
                sendTelegramMessage(chatId, `✅ <b>Cộng tiền thành công!</b>\n\n👤 Tài khoản: <b>${targetUser}</b>\n💵 Được cộng: +${amount.toLocaleString()}đ\n➔ Số dư mới: <b>${newBal.toLocaleString()}đ</b>`);
            } else {
                sendTelegramMessage(chatId, `❌ Không thấy tài khoản [<b>${targetUser}</b>] trên hệ thống.`);
            }
        }
        // 🔍 CÚ PHÁP 2: Check tài khoản đơn lẻ
        else if (textLower.startsWith("check")) {
            let parts = text.split(/\s+/);
            if (parts.length < 2) return;
            let targetUser = parts[1];
            const snapshot = await get(ref(db, `users/${targetUser}`));

            if (snapshot.exists()) {
                sendTelegramMessage(chatId, `🔍 <b>THÔNG TIN VÍ KHÁCH:</b>\n\n👤 Tài khoản: <b>${targetUser}</b>\n💰 Số dư balance: <b>${Number(snapshot.val().balance || 0).toLocaleString()}đ</b>`);
            } else {
                sendTelegramMessage(chatId, `❌ Không tìm thấy tài khoản [<b>${targetUser}</b>].`);
            }
        }
        // 📜 CÚ PHÁP 3: XEM TOÀN BỘ DANH SÁCH VÍ TIỀN KHÁCH HÀNG
        else if (textLower === "xem" || textLower === "xem danh sach" || textLower === "xem danh sách") {
            try {
                const snapshot = await get(ref(db, 'users'));
                if (snapshot.exists()) {
                    const users = snapshot.val();
                    let reportText = "📜 <b>DANH SÁCH VÍ TÀI KHOẢN:</b>\n\n";
                    let count = 1;
                    
                    for (let id in users) {
                        let u = users[id];
                        let name = u.username || u.name || id;
                        let bal = Number(u.balance || 0);
                        reportText += `${count}. 👤 <b>${name}</b>: <code>${bal.toLocaleString()}đ</code>\n`;
                        count++;
                    }
                    
                    pushLog(`📜 Sếp vừa bấm gọi lệnh xem danh sách ví qua Telegram.`);
                    sendTelegramMessage(chatId, reportText);
                } else {
                    sendTelegramMessage(chatId, "⚠️ Cơ sở dữ liệu nhánh <code>users</code> hiện đang trống sếp ơi!");
                }
            } catch (err) {
                sendTelegramMessage(chatId, "❌ Lỗi đọc dữ liệu danh sách rồi sếp!");
            }
        }
        else {
            if (textLower === "/start") {
                sendTelegramMessage(chatId, "👋 <b>Chào sếp Duy!</b> Em đã kết nối trực tiếp vào Database.\n\nSếp nhắn lệnh để em làm việc nhé:\n1️⃣ <code>Cộng tiền [tên_khách] [số_tiền]</code>\n2️⃣ <code>Check [tên_khách]</code>\n3️⃣ <code>Xem</code> để lấy toàn bộ danh sách ví");
            } else {
                sendTelegramMessage(chatId, "🤖 <b>Lệnh không hợp lệ sếp ơi!</b>\nSếp dùng các cú pháp này nhé:\n\n1️⃣ <code>Cộng tiền [tên_khách] [số_tiền]</code>\n2️⃣ <code>Check [tên_khách]</code>\n3️⃣ <code>Xem</code> để lấy danh sách ví");
            }
        }
    }

    async function sendTelegramMessage(chatId, text) {
        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'HTML' })
            });
        } catch(e) { console.error("Lỗi rep:", e); }
    }

    function pushLog(text) {
        const empty = logListTarget.querySelector('.empty'); if (empty) empty.remove();
        const div = document.createElement('div'); div.className = 'log-card tele-cmd';
        div.innerHTML = `<div class="log-meta"><span>📥 ACTION</span><span>${new Date().toLocaleTimeString()}</span></div><div>${text}</div>`;
        logListTarget.insertBefore(div, logListTarget.firstChild);
    }

    checkTelegramMessages();

    searchBar.addEventListener('input', (e) => {
        let kw = e.target.value.toLowerCase();
        let cards = userListTarget.getElementsByClassName('user-card');
        for (let i = 0; i < cards.length; i++) {
            cards[i].style.display = cards[i].getAttribute('data-search').includes(kw) ? 'flex' : 'none';
        }
    });
</script>
</body>
</html>
