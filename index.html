<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Server Monitor - Toàn Bộ Giao Dịch & Admin</title>
    <style>
        :root {
            --bg-color: #060814;
            --card-bg: #0b1120;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 24px; color: var(--primary); }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            text-align: center;
        }
        .stat-title { font-size: 14px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 32px; font-weight: bold; margin-top: 5px; font-family: monospace; }
        .stat-value.total { color: var(--success); }

        .main-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h2 { font-size: 16px; color: var(--primary); margin: 0; }
        
        .btn-clear {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-clear:hover { background: var(--danger); color: #fff; }

        .log-list {
            max-height: 550px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .log-item {
            background: rgba(255, 255, 255, 0.02);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 4px;
        }
        .log-item.approved { border-left-color: var(--success); background: rgba(16, 185, 129, 0.03); }
        .log-item.admin-action { border-left-color: var(--danger); background: rgba(239, 68, 68, 0.03); }
        .log-item.system { border-left-color: #a855f7; background: rgba(168, 85, 247, 0.03); }
        
        .log-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
        .log-text { font-size: 14px; line-height: 1.5; }
        
        .hl-admin { color: #ff4d4d; font-weight: bold; }
        .hl-user { color: #38bdf8; font-weight: bold; }
        .hl-money { color: #10b981; font-weight: bold; }
        .hl-info { color: #e2e8f0; font-weight: bold; }

        .empty { text-align: center; color: var(--text-sub); padding: 40px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>M.DUY AI LIVE MONITOR PRO</h1>
            <div style="font-size: 12px; color: var(--text-sub);">Theo dõi không giới hạn - Quét toàn bộ hành vi Admin và Hệ thống</div>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="stat-card">
            <div class="stat-title">💰 TỔNG TIỀN ĐÃ DUYỆT (TẤT CẢ TÀI KHOẢN TỪ TRƯỚC TỚI GIỜ)</div>
            <div id="total-approved" class="stat-value total">0đ</div>
        </div>
    </div>

    <div class="main-card">
        <div class="card-header">
            <h2>🤖 NHẬT KÝ BIẾN ĐỘNG THỜI GIAN THỰC (LƯU VĨNH VIỄN)</h2>
            <button class="btn-clear" id="clear-btn">Xóa nhật ký</button>
        </div>
        <div id="log-list" class="log-list">
            <div class="empty">Đang kết nối cơ sở dữ liệu và đồng bộ hóa lịch sử giao dịch...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const logListEl = document.getElementById('log-list');
    const totalApprovedEl = document.getElementById('total-approved');

    let oldData = null;
    let isFirstLoad = true;
    let savedLogs = JSON.parse(localStorage.getItem('duy_ai_pro_logs')) || [];

    // Hiển thị lại các log cũ đã được lưu trữ trong trình duyệt
    renderSavedLogs();

    // Lắng nghe dữ liệu thời gian thực từ Firebase
    onValue(ref(db, '/'), (snapshot) => {
        const newData = snapshot.val();

        // 1. Quét sâu để tính tổng tất cả giao dịch từ trước đến nay (Không bỏ sót ví nào)
        calculateAllFinancials(newData);

        if (isFirstLoad) {
            oldData = JSON.parse(JSON.stringify(newData));
            isFirstLoad = false;
            if(savedLogs.length === 0) {
                pushAiLog('system', 'Hệ thống AI đã kết nối thành công và đang theo dõi toàn bộ tài khoản (bao gồm cả Admin).');
            }
            return;
        }

        // 2. Phân tích chi tiết hành vi thay đổi thời gian thực
        deepAnalyzeChanges(oldData, newData);

        // Lưu dữ liệu để đối chiếu cho lần kế tiếp
        oldData = JSON.parse(JSON.stringify(newData));
    });

    // 🌟 TÍNH TỔNG TIỀN TẤT CẢ GIAO DỊCH ĐÃ DUYỆT TỪ TRƯỚC TỚI NAY
    function calculateAllFinancials(data) {
        if (!data) return;
        
        let totalApproved = 0;

        function scanDeep(obj) {
            if (!obj || typeof obj !== 'object') return;

            // Kiểm tra trạng thái giao dịch thành công / đã duyệt
            const isApproved = obj.status === 'success' || obj.status === 'đã duyệt' || obj.status === 'approved' || obj.trangthai === 'thành công';
            if (isApproved) {
                let money = obj.money || obj.sodu || obj.amount || obj.sotien || 0;
                totalApproved += Number(money);
            }

            for (let k in obj) {
                if (typeof obj[k] === 'object' && obj[k] !== null) {
                    scanDeep(obj[k]);
                }
            }
        }

        scanDeep(data);
        totalApprovedEl.innerText = totalApproved.toLocaleString('vi-VN') + 'đ';
    }

    // 🧠 AI PHÂN TÍCH CHI TIẾT - BAO GỒM CẢ THAO TÁC CỦA ADMIN
    function deepAnalyzeChanges(oldObj, newObj) {
        if (!newObj || !oldObj) return;

        function compareNodes(oldNode, newNode) {
            if (typeof newNode !== 'object' || !newNode || !oldNode) return;

            for (let key in newNode) {
                // Định nghĩa xem node này có liên quan đến Admin hay không để gán nhãn cảnh báo đặc biệt
                let isAdminRelated = key.toLowerCase().includes('admin') || key.toLowerCase().includes('mduy');

                // Trường hợp 1: Có một giao dịch mới hoàn toàn vừa xuất hiện
                if (!oldNode[key]) {
                    let item = newNode[key];
                    if (item && (item.status === 'success' || item.status === 'đã duyệt' || item.status === 'approved')) {
                        let target = item.username || item.name || item.user || key;
                        let amount = item.money || item.amount || item.sotien || 0;
                        let lyDo = item.note || item.reason || 'Nạp tiền';
                        
                        let logType = isAdminRelated ? 'admin-action' : 'approved';
                        let prefix = isAdminRelated ? `👑 <strong>[ADMIN THAO TÁC]:</strong> ` : `🎉 <strong>Giao dịch mới:</strong> `;

                        pushAiLog(logType, `${prefix}Phát hiện tài khoản <span class="hl-admin">${target}</span> vừa hoàn thành giao dịch thành công. Số tiền: <span class="hl-money">${Number(amount).toLocaleString()}đ</span>. Nội dung: <span class="hl-info">${lyDo}</span>.`);
                    }
                } else {
                    // Trường hợp 2: Giao dịch có sẵn đổi trạng thái từ "Chờ" sang "Đã Duyệt"
                    let oldSub = oldNode[key];
                    let newSub = newNode[key];

                    if (typeof newSub === 'object' && oldSub) {
                        let oldStatus = oldSub.status || oldSub.trangthai;
                        let newStatus = newSub.status || newSub.trangthai;

                        if (oldStatus !== newStatus && (newStatus === 'success' || newStatus === 'đã duyệt' || newStatus === 'approved')) {
                            let target = newSub.username || newSub.name || newSub.user || key;
                            let amount = newSub.money || newSub.amount || newSub.sotien || 0;
                            let adminName = newSub.handler || newSub.admin || 'Admin Hệ Thống';
                            
                            pushAiLog('admin-action', `⚙️ <strong>[HÀNH VI ĐIỀU HÀNH]:</strong> Quản trị viên <span class="hl-admin">${adminName}</span> vừa trực tiếp duyệt thành công lệnh tiền cho tài khoản <span class="hl-user">${target}</span>. Số tiền thực nhận: <span class="hl-money">${Number(amount).toLocaleString()}đ</span>.`);
                        }
                    }
                    // Tiếp tục đào sâu xuống các tầng dữ liệu con
                    compareNodes(oldNode[key], newNode[key]);
                }
            }
        }
        compareNodes(oldObj, newObj);
    }

    // Hàm xuất Log, hiển thị ra màn hình và nạp vào LocalStorage vĩnh viễn
    function pushAiLog(type, text) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString() + ' | ' + now.toLocaleDateString();
        
        const logData = { type, text, time: timeStr };
        savedLogs.unshift(logData);
        localStorage.setItem('duy_ai_pro_logs', JSON.stringify(savedLogs));

        renderSingleLog(logData, true);
    }

    function renderSingleLog(log, isNew = false) {
        const emptyEl = document.querySelector('.empty');
        if (emptyEl) emptyEl.remove();

        const item = document.createElement('div');
        item.className = `log-item ${log.type}`;
        if (isNew) item.style.animation = "fadeIn 0.3s ease";

        item.innerHTML = `
            <div class="log-meta">
                <span>🤖 TRỢ LÝ GIÁM SÁT AI TOÀN DIỆN</span>
                <span>${log.time}</span>
            </div>
            <div class="log-text">${log.text}</div>
        `;

        if (isNew) {
            logListEl.insertBefore(item, logListEl.firstChild);
        } else {
            logListEl.appendChild(item);
        }
    }

    function renderSavedLogs() {
        if (savedLogs.length > 0) {
            logListEl.innerHTML = '';
            savedLogs.forEach(log => renderSingleLog(log, false));
        }
    }

    // Nút dọn dẹp màn hình
    document.getElementById('clear-btn').addEventListener('click', () => {
        if (confirm('Bạn muốn dọn dẹp giao diện báo cáo này không? (Số tiền tổng phía trên vẫn được bảo lưu chính xác)')) {
            localStorage.removeItem('duy_ai_pro_logs');
            savedLogs = [];
            logListEl.innerHTML = '<div class="empty">Nhật ký trống. Đang chờ biến động thời gian thực...</div>';
        }
    });
</script>

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</body>
</html>
