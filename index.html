<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ Lý AI Giám Sát Máy Chủ</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --primary: #38bdf8;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #1f2937;
            margin-bottom: 25px;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-clear {
            background: rgba(248, 113, 113, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-clear:hover {
            background: var(--danger);
            color: white;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #1f2937;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            font-size: 16px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .log-container {
            max-height: 650px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .log-item {
            background: #1f2937;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid var(--primary);
            position: relative;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        .ai-text {
            font-size: 15px;
            line-height: 1.6;
            color: #f3f4f6;
        }
        .ai-text strong {
            color: #fff;
        }
        /* Chỉ định màu sắc theo loại hành động */
        .log-item.money { border-left-color: var(--success); background: rgba(52, 211, 153, 0.03); }
        .log-item.status { border-left-color: var(--warning); background: rgba(251, 191, 36, 0.03); }
        .log-item.general { border-left-color: var(--primary); }
        
        .empty-state {
            text-align: center;
            color: #6b7280;
            padding: 40px;
            font-style: italic;
        }
        .highlight-name { color: #60a5fa !important; font-weight: bold; }
        .highlight-money { color: #34d399 !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>M.DUY AI MONITOR</h1>
            <div style="font-size: 12px; color: #6b7280; margin-top: 4px;">Hệ thống lưu trữ vĩnh viễn đã kích hoạt ✔</div>
        </div>
        <button class="btn-clear" id="clear-btn">Xóa Lịch Sử</button>
    </header>

    <div class="card">
        <h2>🤖 Báo cáo từ Trợ lý ảo (AI Insights)</h2>
        <div id="log-container" class="log-container">
            <div class="empty-state">Đang đợi kết nối và phân tích luồng dữ liệu...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    const logContainerEl = document.getElementById('log-container');
    const clearBtn = document.getElementById('clear-btn');

    let oldData = null;
    let isFirstLoad = true;

    // Tải lại lịch sử cũ từ LocalStorage khi vừa mở web (Không lo mất khi đóng tab)
    let savedLogs = JSON.parse(localStorage.getItem('ai_server_logs')) || [];
    renderSavedLogs();

    // Lắng nghe dữ liệu từ Firebase
    onValue(ref(db, '/'), (snapshot) => {
        const newData = snapshot.val();

        if (isFirstLoad) {
            oldData = JSON.parse(JSON.stringify(newData));
            isFirstLoad = false;
            if(savedLogs.length === 0) {
                generateAiSpeech("general", "Hệ thống AI vừa khởi động thành công. Hiện tại đang giữ trạng thái giám sát tối cao, chưa phát hiện biến động mới nào.");
            }
            return;
        }

        // Chạy bộ lọc thông minh dịch ngôn ngữ
        translateDataToAiSpeech(oldData, newData);
        
        // Lưu lại dữ liệu cũ để so sánh tiếp
        oldData = JSON.parse(JSON.stringify(newData));
    });

    // 🧠 BỘ NÃO AI: Đọc hiểu dữ liệu và dịch thành câu nói của con người
    function translateDataToAiSpeech(oldObj, newObj) {
        if (!newObj || !oldObj) return;

        // Quét qua các key trong database của bạn (ví dụ: users, orders, nap_tien...)
        for (let key in newObj) {
            // So sánh nếu có sự thay đổi dữ liệu ở mục này
            if (JSON.stringify(oldObj[key]) !== JSON.stringify(newObj[key])) {
                
                let currentItem = newObj[key];
                let oldItem = oldObj[key];

                // 🌟 KỊCH BẢN 1: DUYỆT TIỀN / NẠP TIỀN / ĐỔI SỐ DƯ
                // Nếu cấu trúc dạng vật phẩm/user có trường "money" hoặc "sodu" hoặc "status"
                if (typeof currentItem === 'object') {
                    // Thử tìm xem đây là hành động duyệt/nạp gì thông qua cấu trúc phổ biến
                    for (let subKey in currentItem) {
                        let modern = currentItem[subKey];
                        let ancient = oldItem ? oldItem[subKey] : null;
                        
                        if (ancient && JSON.stringify(modern) !== JSON.stringify(ancient)) {
                            // Trường hợp thay đổi số tiền / Số dư
                            if (subKey === 'money' || subKey === 'sodu' || subKey === 'balance') {
                                let tenUser = currentItem.username || currentItem.name || subKey;
                                generateAiSpeech("money", `💰 <strong>Hệ thống vừa thực hiện giao dịch:</strong> Tài khoản của <span class="highlight-name">${tenUser}</span> vừa biến động từ <span class="highlight-money">${ancient[subKey]}đ</span> sang <span class="highlight-money">${modern[subKey]}đ</span>. Yêu cầu đã được xử lý thành công.`);
                                return;
                            }
                            // Trường hợp thay đổi Trạng thái (Ví dụ: tu "đang chờ" sang "đã duyệt")
                            if (subKey === 'status' || subKey === 'trangthai') {
                                let tenUser = currentItem.username || currentItem.name || key;
                                generateAiSpeech("status", `⚙️ <strong>Cập nhật trạng thái hành động:</strong> Admin đã thay đổi trạng thái mục <span class="highlight-name">${tenUser}</span> từ [${ancient[subKey]}] sang thành [${modern[subKey]}]. Các thông tin liên quan đã được đồng bộ hóa.`);
                                return;
                            }
                        }
                    }
                }

                // 🌟 KỊCH BẢN 2: Thêm một dòng/yêu cầu hoàn toàn mới
                if (oldItem && Object.keys(currentItem).length > Object.keys(oldItem).length) {
                    generateAiSpeech("general", `📥 <strong>Ghi nhận yêu cầu mới:</strong> Hệ thống máy chủ vừa tiếp nhận thêm một dữ liệu mới tại danh mục <strong>${key}</strong>. AI đã lưu trữ và bảo mật dữ liệu này.`);
                    return;
                }

                // 🌟 KỊCH BẢN 3: Báo cáo chung chung nếu không rơi vào các trường hợp trên
                generateAiSpeech("general", `⚡ <strong>Thông báo từ máy chủ:</strong> Danh mục <strong>${key}</strong> vừa có sự thay đổi nội dung. Admin hoặc hệ thống tự động đã cập nhật lại phần này.`);
            }
        }
    }

    // Hàm tạo câu nói AI, hiển thị lên màn hình và LƯU VÀO BỘ NHỚ MÁY
    function generateAiSpeech(type, text) {
        const now = new Date();
        const timeString = now.toLocaleTimeString() + " - " + now.toLocaleDateString();

        const newLog = { type, text, time: timeString };
        
        // Thêm vào mảng tạm và lưu thẳng vào LocalStorage của trình duyệt
        savedLogs.unshift(newLog); // Đưa lên đầu
        localStorage.setItem('ai_server_logs', JSON.stringify(savedLogs));

        // Render ra màn hình
        renderLogItem(newLog, true);
    }

    // Hàm vẽ giao diện từ dữ liệu log
    function renderLogItem(log, isNew = false) {
        // Xóa chữ trống ban đầu nếu có
        const emptyState = document.querySelector('.empty-state');
        if (emptyState) emptyState.remove();

        const logItem = document.createElement('div');
        logItem.className = `log-item ${log.type}`;
        if(isNew) logItem.style.animation = "slideIn 0.3s ease";

        logItem.innerHTML = `
            <div class="log-header">
                <span>🤖 TRỢ LÝ AI PHÂN TÍCH</span>
                <span>${log.time}</span>
            </div>
            <div class="ai-text">${log.text}</div>
        `;

        if (isNew) {
            logContainerEl.insertBefore(logItem, logContainerEl.firstChild);
        } else {
            logContainerEl.appendChild(logItem);
        }
    }

    // Hàm tải lại toàn bộ Log cũ khi F5/Mở lại trang
    function renderSavedLogs() {
        if (savedLogs.length > 0) {
            logContainerEl.innerHTML = "";
            savedLogs.forEach(log => {
                renderLogItem(log, false);
            });
        }
    }

    // Nút xóa toàn bộ lịch sử nếu muốn làm sạch trang
    clearBtn.addEventListener('click', () => {
        if(confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử báo cáo của AI không?")) {
            localStorage.removeItem('ai_server_logs');
            savedLogs = [];
            logContainerEl.innerHTML = '<div class="empty-state">Lịch sử đã được dọn sạch. Đang đợi biến động mới...</div>';
        }
    });
</script>

<style>
    @keyframes slideIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</body>
</html>
