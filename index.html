<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔓 Giải mã Tool</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 100%);
    color: #fff; min-height: 100vh; padding: 16px;
    display: flex; flex-direction: column; align-items: center;
}
.container { max-width: 900px; width: 100%; }
h1 {
    text-align: center; font-size: 22px; margin-bottom: 8px;
    background: linear-gradient(135deg, #22c55e, #06b6d4);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-weight: 800;
}
.subtitle { text-align: center; font-size: 12px; color: #888; margin-bottom: 20px; }
.card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(34,197,94,0.3);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
}
.label {
    font-size: 12px; font-weight: 700; color: #22c55e;
    margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
}
.file-input-wrapper {
    position: relative; display: block; width: 100%; padding: 20px;
    background: rgba(0,0,0,0.3); border: 2px dashed rgba(34,197,94,0.5);
    border-radius: 12px; text-align: center; cursor: pointer;
    transition: all 0.2s; margin-bottom: 10px;
}
.file-input-wrapper:hover { border-color: #22c55e; background: rgba(34,197,94,0.05); }
.file-input-wrapper.has-file { border-color: #22c55e; background: rgba(34,197,94,0.05); border-style: solid; }
.file-input-wrapper input[type="file"] {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
}
.file-icon { font-size: 32px; margin-bottom: 6px; }
.file-text { font-size: 13px; color: #ccc; font-weight: 700; }
.file-sub { font-size: 11px; color: #888; margin-top: 4px; }
.file-name { font-size: 12px; color: #22c55e; margin-top: 8px; font-weight: 700; word-break: break-all; }
textarea {
    width: 100%; min-height: 180px; background: rgba(0,0,0,0.5);
    border: 1px solid rgba(34,197,94,0.4); border-radius: 10px; color: #fff;
    padding: 12px; font-family: 'Courier New', monospace; font-size: 12px;
    resize: vertical; outline: none; line-height: 1.5;
}
textarea:focus { border-color: #22c55e; box-shadow: 0 0 15px rgba(34,197,94,0.3); }
button {
    width: 100%; padding: 16px; background: linear-gradient(135deg, #22c55e, #06b6d4);
    border: none; border-radius: 10px; color: #fff; font-weight: 800;
    font-size: 15px; cursor: pointer; transition: 0.2s; letter-spacing: 1px; margin-top: 8px;
}
button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(34,197,94,0.4); }
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.status {
    font-size: 12px; text-align: center; padding: 12px;
    color: #22c55e; min-height: 40px; line-height: 1.5;
    background: rgba(0,0,0,0.3); border-radius: 10px; margin-top: 12px;
}
.status.error { color: #ef4444; }
.status.loading { color: #f59e0b; }
.copy-btn {
    background: rgba(59,130,246,0.2); border: 1px solid rgba(59,130,246,0.5);
    color: #60a5fa; padding: 12px; margin-top: 8px; font-weight: 700;
}
.copy-btn:hover { background: rgba(59,130,246,0.3); }
.download-btn {
    background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.5);
    color: #22c55e; padding: 14px; margin-top: 8px; font-weight: 800; font-size: 14px;
}
.download-btn:hover { background: rgba(34,197,94,0.3); }
.hint {
    background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.4);
    border-radius: 10px; padding: 12px; font-size: 12px; color: #60a5fa;
    line-height: 1.6; margin-bottom: 14px;
}
.divider {
    display: flex; align-items: center; gap: 10px; margin: 14px 0;
    color: #666; font-size: 11px; font-weight: 700;
}
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(34,197,94,0.2); }
</style>
</head>
<body>

<div class="container">
    <h1>🔓 GIẢI MÃ TOOL</h1>
    <div class="subtitle">Khôi phục code gốc từ file đã mã hoá</div>

    <div class="hint">
        💡 <b>Cách dùng:</b> Kéo file đã mã hoá vào → Nhấn "GIẢI MÃ" → Copy hoặc tải code gốc về.
    </div>

    <div class="card">
        <div class="label">📁 CHỌN FILE ĐÃ MÃ HOÁ</div>
        <label class="file-input-wrapper" id="file-wrapper">
            <input type="file" id="file-input" accept=".txt,.js,.user.js,text/plain,application/javascript">
            <div class="file-icon">📄</div>
            <div class="file-text">Nhấn hoặc kéo file vào đây</div>
            <div class="file-sub">Hỗ trợ: .txt, .js, .user.js</div>
            <div class="file-name" id="file-name" style="display:none;"></div>
        </label>
    </div>

    <div class="divider">HOẶC</div>

    <div class="card">
        <div class="label">📥 DÁN CODE ĐÃ MÃ HOÁ VÀO ĐÂY</div>
        <textarea id="input" placeholder="Dán code đã mã hoá..." spellcheck="false"></textarea>
    </div>

    <button id="decrypt-btn">🔓 GIẢI MÃ NGAY</button>

    <div class="status" id="status">Sẵn sàng — Chọn file hoặc dán code</div>

    <div class="card" id="output-card" style="display:none;">
        <div class="label">✅ CODE GỐC ĐÃ KHÔI PHỤC</div>
        <textarea id="output" readonly spellcheck="false"></textarea>
        <button class="copy-btn" id="copy-btn">📋 COPY CODE</button>
        <button class="download-btn" id="download-btn">💾 TẢI FILE .user.js</button>
    </div>
</div>

<script>
(function() {
    'use strict';

    var $ = function(id) { return document.getElementById(id); };

    function setStatus(text, type) {
        var el = $('status');
        el.textContent = text;
        el.className = 'status' + (type ? ' ' + type : '');
    }

    // ===== CHỌN FILE =====
    $('file-input').addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            $('input').value = ev.target.result;
            $('file-name').textContent = '✅ ' + file.name + ' (' + (file.size / 1024).toFixed(1) + 'KB)';
            $('file-name').style.display = 'block';
            $('file-wrapper').classList.add('has-file');
            setStatus('✅ Đã đọc file: ' + file.name, 'success');
        };
        reader.readAsText(file);
    });

    // ===== KÉO THẢ =====
    var wrapper = $('file-wrapper');
    wrapper.addEventListener('dragover', function(e) {
        e.preventDefault();
        wrapper.style.borderColor = '#22c55e';
        wrapper.style.background = 'rgba(34,197,94,0.1)';
    });
    wrapper.addEventListener('dragleave', function(e) {
        e.preventDefault();
        wrapper.style.borderColor = '';
        wrapper.style.background = '';
    });
    wrapper.addEventListener('drop', function(e) {
        e.preventDefault();
        wrapper.style.borderColor = '';
        wrapper.style.background = '';
        var file = e.dataTransfer.files[0];
        if (file) {
            var reader = new FileReader();
            reader.onload = function(ev) {
                $('input').value = ev.target.result;
                $('file-name').textContent = '✅ ' + file.name;
                $('file-name').style.display = 'block';
                wrapper.classList.add('has-file');
                setStatus('✅ Đã đọc: ' + file.name, 'success');
            };
            reader.readAsText(file);
        }
    });

    // ===== GIẢI MÃ BASE64 =====
    function decodeBase64(s) {
        try {
            var b = atob(s);
            return decodeURIComponent(escape(b));
        } catch(e) {
            return "";
        }
    }

    // ===== TÁCH HEADER =====
    function extractHeader(code) {
        var match = code.match(/\/\/ ==UserScript==[\s\S]*?\/\/ ==\/UserScript==/);
        return match ? match[0] : '';
    }

    // ===== TÌM CHUNKS TRONG WRAPPER =====
    function extractChunks(code) {
        // Pattern 1: V3 - var _c = ['...','...'];
        var match = code.match(/var\s+_c\s*=\s*\[([\s\S]*?)\]\s*;/);
        if (match) {
            var chunkStr = match[1];
            var chunks = [];
            var re = /'([^']*)'/g;
            var m;
            while ((m = re.exec(chunkStr)) !== null) {
                chunks.push(m[1]);
            }
            if (chunks.length > 0) return chunks;
        }

        // Pattern 2: V1/V2 - chunks trong mảng khác
        var match2 = code.match(/\[('(?:[^'\\]|\\.)*'(?:\s*,\s*'(?:[^'\\]|\\.)*')*)\]/);
        if (match2) {
            var chunks2 = [];
            var re2 = /'([^']*)'/g;
            var m2;
            while ((m2 = re2.exec(match2[1])) !== null) {
                chunks2.push(m2[1]);
            }
            if (chunks2.length > 0) return chunks2;
        }

        // Pattern 3: Fallback - tìm chuỗi Base64 dài
        var match3 = code.match(/([A-Za-z0-9+/=]{200,})/g);
        if (match3) {
            return [match3.join('')];
        }

        return null;
    }

    // ===== GIẢI MÃ CHÍNH =====
    $('decrypt-btn').onclick = function() {
        var btn = $('decrypt-btn');
        btn.disabled = true;
        setStatus('🔍 Đang phân tích...', 'loading');

        try {
            var input = $('input').value.trim();

            if (!input) {
                setStatus('❌ Chưa có code!', 'error');
                btn.disabled = false;
                return;
            }

            // Lấy header
            var header = extractHeader(input);

            setStatus('📦 Đang tách chunks...', 'loading');

            // Tìm chunks
            var chunks = extractChunks(input);

            if (!chunks || chunks.length === 0) {
                setStatus('❌ Không tìm thấy dữ liệu mã hoá trong code!', 'error');
                btn.disabled = false;
                return;
            }

            setStatus('🔓 Đang giải mã ' + chunks.length + ' chunks...', 'loading');

            // Ghép chunks lại thành chuỗi Base64
            var b64 = chunks.join('');

            // Giải mã
            var decoded = decodeBase64(b64);

            if (!decoded || decoded.length < 10) {
                setStatus('❌ Không giải mã được! Code có thể đã bị sửa.', 'error');
                btn.disabled = false;
                return;
            }

            // Ghép header + code gốc
            var outputCode = header ? header + '\n\n' + decoded : decoded;

            $('output').value = outputCode;
            $('output-card').style.display = 'block';

            var encKB = (new Blob([input]).size / 1024).toFixed(1);
            var decKB = (new Blob([outputCode]).size / 1024).toFixed(1);

            setStatus('✅ Giải mã thành công! ' + encKB + 'KB → ' + decKB + 'KB', 'success');
            btn.disabled = false;

        } catch(err) {
            console.error(err);
            setStatus('❌ Lỗi: ' + err.message, 'error');
            btn.disabled = false;
        }
    };

    // ===== COPY =====
    $('copy-btn').onclick = function() {
        var ta = $('output');
        ta.select();
        ta.setSelectionRange(0, 999999);
        try {
            navigator.clipboard.writeText(ta.value).then(function() {
                $('copy-btn').textContent = '✅ ĐÃ COPY!';
                setTimeout(function() { $('copy-btn').textContent = '📋 COPY CODE'; }, 1500);
            });
        } catch(e) {
            document.execCommand('copy');
            $('copy-btn').textContent = '✅ ĐÃ COPY!';
            setTimeout(function() { $('copy-btn').textContent = '📋 COPY CODE'; }, 1500);
        }
    };

    // ===== TẢI FILE =====
    $('download-btn').onclick = function() {
        var content = $('output').value;
        if (!content) return;
        var blob = new Blob([content], { type: 'text/javascript' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'tool-decoded-' + Date.now() + '.user.js';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        $('download-btn').textContent = '✅ ĐÃ TẢI!';
        setTimeout(function() { $('download-btn').textContent = '💾 TẢI FILE .user.js'; }, 2000);
    };

    setStatus('Sẵn sàng — Chọn file hoặc dán code đã mã hoá');
})();
</script>

</body>
</html>
